/* --- تحويل الأنواع بين الواجهة والقاعدة --- */
function serialiseInvoice(row,kind,year,quarter,companyId){
  /* قراءة الحقول بالأسماء الحالية الصحيحة (مع توافق خلفي مع الأسماء القديمة) */
  const isSale=(kind==='sale');
  const date=isSale?(row.date||row.invoiceDate||null):(row.invoiceDate||row.date||null);
  const base=isSale?num(row.amountBefore||row.amountExcl||row.base||row.beforeVat||0):num(row.amountExcl||row.base||row.amount||row.beforeVat||0);
  const vat=num(row.tax||row.vat||0);
  const total=num(row.amountIncl||row.total||row.afterVat||0);
  return{id:row.id,company_id:companyId,year:year,quarter:quarter,kind:kind,supplier_name:row.supplierName||row.name||row.client||'',tax_number:row.taxNumber||'',invoice_number:row.invoiceNumber||'',invoice_date:date||null,cost_center:row.costCenter||null,base_amount:base,vat_amount:vat,total_amount:total,attachment_url:row.attachmentUrl||null,source:'desktop'};}
/* هل الفاتورة المعلّقة دي من حق المستخدم الحالي يشوفها؟
   المراجع المربوط بشركة معينة لازم يشوف فواتير شركته بس — في كل المسارات
   (تحميل تلقائي + مزامنة لحظية + تحديث يدوي) مش بس وقت الضغط على «تحديث». */
function _pendingVisible(row){
  if(!row)return false;
  if(isReviewer()){const rc=reviewerCompanies();if(rc.length)return rc.indexOf(String(row.company_id))>=0;}
  return true;
}
function setFromRow(kind,row,year,quarter){
  if(row&&isDeleted(row.id))return;/* الفاتورة اتمسحت محلياً — مانرجعهاش من السحابة */
  /* فاتورة حذفها المراجع (status=deleted): ماتدخلش الأرباع ولا المعلّقة — تتشال من اللابتوب وتفضل عند القارئ بحالة محذوف */
  if(row&&row.status==='deleted'){if(pendingRows[row.id])delete pendingRows[row.id];_removeFromQuarters(row);try{updatePendingBadge();}catch(e){}return;}
  /* الفواتير المعلّقة/المرفوضة لا تدخل الأرباع — تُعرض في تبويب الفواتير المعلّقة */
  if(row&&row.status&&(row.status==='pending'||row.status==='rejected')){if(_pendingVisible(row)){pendingRows[row.id]=row;}else if(pendingRows[row.id]){delete pendingRows[row.id];}_removeFromQuarters(row);try{updatePendingBadge();if(sel.view==='pending'||isReviewer())scheduleRealtimeRefresh(0);}catch(e){}return;}
  if(row&&pendingRows[row.id]){delete pendingRows[row.id];try{updatePendingBadge();}catch(e){}}
  /* توجيه الفاتورة لشركتها الصحيحة حسب company_id وليس الشركة المفتوحة حالياً */
  const c=state.companies.find(x=>x.id===row.company_id);
  if(!c)return;
  let y=c.years.find(x=>x.year===year);
  if(!y){y={year:year,quarters:{1:emptyQuarter(),2:emptyQuarter(),3:emptyQuarter(),4:emptyQuarter()}};c.years.push(y);}
  const qk=String(quarter);if(!y.quarters[qk])y.quarters[qk]=emptyQuarter();
  const q=y.quarters[qk];
  const bucket=kind==='sale'?'sales':(kind==='return'?'returns':'purchases');
  const arr=q[bucket]||(q[bucket]=[]);
  let r=arr.find(x=>x.id===row.id);
  /* لو العمود كان ناقص وقت الحفظ ومسجلين المركز عندنا، نرجّعه على الفاتورة فورًا */
  const _qcc=(row&&row.cost_center)?null:(_ccQueue[row.id]||null);
  if(_qcc&&row&&!row.cost_center)row.cost_center=_qcc;
  let data;
  if(bucket==='sales'){
    data={id:row.id,date:row.invoice_date||'',invoiceNumber:row.invoice_number||(r&&r.invoiceNumber)||'',costCenter:row.cost_center||(r&&r.costCenter)||'',amountIncl:num(row.total_amount||0),tax:num(row.vat_amount||0),amountBefore:num(row.base_amount||0),enteredBy:row.entered_by_name||row.entered_by||(r&&r.enteredBy)||'',approvedBy:row.approved_by||row.reviewed_name||(r&&r.approvedBy)||getApprover(row.id)||'',attachmentUrl:row.attachment_url||'',attachmentId:(r&&r.attachmentId)||null,remote:true};
  }else{
    data={id:row.id,supplierName:row.supplier_name||'',taxNumber:row.tax_number||'',invoiceDate:row.invoice_date||'',invoiceNumber:row.invoice_number||(r&&r.invoiceNumber)||'',costCenter:row.cost_center||(r&&r.costCenter)||'',amountExcl:num(row.base_amount||0),tax:num(row.vat_amount||0),amountIncl:num(row.total_amount||0),enteredBy:row.entered_by_name||row.entered_by||(r&&r.enteredBy)||'',approvedBy:row.approved_by||row.reviewed_name||(r&&r.approvedBy)||getApprover(row.id)||'',attachmentUrl:row.attachment_url||'',attachmentId:(r&&r.attachmentId)||null,remote:true};
  }
  if(r){
    /* دمج غير مُتلِف: ما نمسحش قيمة محلية موجودة بقيمة فاضية/صفر جاية من السحابة */
    for(const _k in data){const nv=data[_k];const ov=r[_k];const nvEmpty=(nv===''||nv===null||typeof nv==='undefined'||(typeof nv==='number'&&nv===0));const ovFilled=!(ov===''||ov===null||typeof ov==='undefined'||(typeof ov==='number'&&ov===0));if(nvEmpty&&ovFilled)continue;r[_k]=nv;}
    r.remote=true;
  }else{arr.push(data);}
  if(bucket!=='sales'&&row.supplier_name){const s=state.suppliers.find(x=>x.name===row.supplier_name);if(!s)state.suppliers.push({id:uid(),name:row.supplier_name,taxNumber:row.tax_number||''});}
  if(row.cost_center)rememberCostCenter(row.cost_center);
  if(_qcc&&sb&&cloud.enabled){try{sb.from('invoices').update({cost_center:_qcc}).eq('id',row.id).then(up=>{if(!up.error){delete _ccQueue[row.id];ccQueueSave();}});}catch(e){}}
}
function applyRow(kind,row,noRender){setFromRow(kind,row,row.year,row.quarter);saveStateLocal();if(!noRender&&getCompany()&&getCompany().id===row.company_id){render();}}
function removeRow(kind,row,noRender){if(row&&pendingRows[row.id]){delete pendingRows[row.id];try{updatePendingBadge();}catch(e){}}const c=state.companies.find(x=>x.id===row.company_id);if(!c)return;const y=c.years.find(x=>x.year===row.year);if(!y)return;const qk=String(row.quarter);if(!y.quarters[qk])return;const bucket=kind==='sale'?'sales':(kind==='return'?'returns':'purchases');const _arr=y.quarters[qk][bucket]||[];const _ex=_arr.find(x=>x.id===row.id);if(_ex&&_ex.localOnly)return;/* فاتورة متخزّنة محليًا (معتمدة) — ما تتشالش بسبب حذفها من السحابة (السحابة وصلة عبور بس) */y.quarters[qk][bucket]=_arr.filter(x=>x.id!==row.id);saveStateLocal();if(!noRender)render();}
/* تجميع أحداث المزامنة اللحظية: بدل ما نعمل render وإشعار لكل فاتورة (بيسبّب تعليق وتكرار الإشعار)، نجمّعهم وننفّذ مرة واحدة بعد هدوء بسيط */
let _rtTimer=null,_rtNewCount=0;
function scheduleRealtimeRefresh(newCount){
  if(newCount)_rtNewCount+=newCount;
  clearTimeout(_rtTimer);
  _rtTimer=setTimeout(()=>{
    const n=_rtNewCount;_rtNewCount=0;
    /* لو المستخدم لسه على شاشة الدخول، ما نعيدش بناء الشاشة عشان ما نمسحش اللي بيكتبه */
    if(!session&&document.getElementById('lg_user')){return;}
    try{render();}catch(e){console.warn('rt render',e);}
    if(n>0)toast(n===1?'📥 وصلت فاتورة جديدة من الموبايل':('📥 وصلت '+n+' فواتير جديدة من الموبايل'));
    setTimeout(()=>{autoSyncAttachments(true).catch(()=>{});},300);
  },900);
}

/* ====== حذف فاتورة من السحابة (عشان ما ترجعش بعد إعادة الفتح) ====== */
async function cloudDeleteInvoice(id,attUrl){
  if(!id)return;
  /* 1) علامة حذف محلية — نستثنيها من أي رفع مستقبلي حتى لو المزامنة مش شغالة */
  markDeleted(id);
  if(!sb||!cloud.enabled)return;
  try{
    const del=await sb.from('invoices').delete().eq('id',id);
    if(del.error)console.warn('cloud delete invoice',del.error);
  }catch(e){console.warn('cloud delete invoice ex',e);}
  /* 2) نحذف صورة المرفق من التخزين السحابي — لازم نطلّع المسار الكامل جوّه الـ bucket (cid/year-Qq/id.ext) من غير ?v= */
  try{
    if(attUrl&&sb){const p=storagePathFromUrl(attUrl);if(p){const rm=await sb.storage.from(CLOUD_BUCKET).remove([p]);if(rm&&rm.error)console.warn('cloud delete att',rm.error);}}
  }catch(e){console.warn('cloud delete att',e);}
}
/* يطلّع مسار الملف جوّه الـ storage bucket من رابط عام، بيشيل الـ query (?v=) والـ prefix بتاع الـ bucket */
function storagePathFromUrl(url){
  if(!url)return '';
  let s=String(url).split('?')[0].split('#')[0];
  const marker='/'+CLOUD_BUCKET+'/';
  const i=s.indexOf(marker);
  if(i>-1){try{return decodeURIComponent(s.slice(i+marker.length));}catch(e){return s.slice(i+marker.length);}}
  try{return decodeURIComponent(s.split('/').pop());}catch(e){return s.split('/').pop();}
}
/* علامة حذف محفوظة على الجهاز — نمنع أي رفع/سحب للفواتير المحذوفة */
const DELETED_KEY='vat_deleted_v1';

function isDeleted(id){return getDeleted().indexOf(id)>-1;}
function markDeleted(id){if(!id)return;try{const a=getDeleted();if(a.indexOf(id)<0){a.push(id);localStorage.setItem(DELETED_KEY,JSON.stringify(a.slice(-2000)));}}catch(e){}}

/* --- رفع صورة الفاتورة إلى التخزين السحابي --- */
function dataURLtoBlob(d){const p=d.split(',');const m=p[0].match(/:(.*?);/);const b=atob(p[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:(m&&m[1])||'image/jpeg'});}
async function cloudUploadAttachment(att){if(!sb||!cloud.enabled||!att)return null;try{const blob=dataURLtoBlob(att.dataURL);const path=(att.name||('img_'+Date.now()+'.jpg')).replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from(CLOUD_BUCKET).upload(path,blob,{upsert:true,contentType:blob.type});if(up.error){console.warn('upload',up.error);return null;}const pub=sb.storage.from(CLOUD_BUCKET).getPublicUrl(path);return pub.data&&pub.data.publicUrl?pub.data.publicUrl:null;}catch(e){console.warn('upload',e);return null;}}

/* --- حفظ صفوف المرفقات (صور الموبايل) من القاعدة إلى IndexedDB --- */
async function downloadRemoteAttachments(){if(!sb||!cloud.enabled)return false;let changed=false;try{const res=await sb.from('invoices').select('id,attachment_url').not('attachment_url','is','null');if(res.error||!res.data)return false;for(const row of res.data){const url=row.attachment_url;if(!url)continue;let already=false;for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r.id===row.id&&r.attachmentId){already=true;}}}if(already)continue;try{const resp=await fetch(url);if(!resp.ok)continue;const blob=await resp.blob();const aid=uid();await putFile(aid,blob);for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r.id===row.id){r.attachmentId=aid;r.attachmentUrl=url;}}}changed=true;}catch(e){console.warn('dl',e);}}}catch(e){console.warn('downloadRemoteAttachments',e);}if(changed)saveState();return changed;}


/* --- تنزيل كل صور الفواتير من السحابة يدوياً --- */
async function redownloadAllAttachments(){
  if(!sb){toast('⚠️ شغّل المزامنة السحابية الأول');return;}
  showCloudLoad('🖼️ جاري التحقق من صور الفواتير على السحابة…');
  let pulled=0;
  try{
    const res=await sb.from('invoices').select('id,attachment_url').not('attachment_url','is','null');
    if(res.error){hideCloudLoad();toast('⚠️ تعذر قراءة المرفقات من السحابة');return;}

    if(!rows.length){hideCloudLoad();toast('ℹ️ مفيش صور مرفوعة على السحابة — اتأكد إن الموبايل رفع الصورة وقت الحفظ');return;}
    for(const row of rows){
      const url=row.attachment_url;if(!url)continue;
      let target=null,hasLocal=false;
      for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r.id===row.id){target=r;if(r.attachmentId){const f=await getFile(r.attachmentId);if(f)hasLocal=true;}}}}
      if(!target)continue;
      target.attachmentUrl=url;
      if(hasLocal)continue;
      showCloudLoad('🖼️ جاري تنزيل الصور… ('+(pulled+1)+')');
      try{
        const resp=await fetch(url);
        if(!resp.ok){console.warn('fetch att',resp.status,url);continue;}
        const blob=await resp.blob();const aid=uid();await putFile(aid,blob);target.attachmentId=aid;pulled++;
      }catch(e){console.warn('dl att',e);}
    }
    saveState();render();
  }catch(e){console.warn('redownload',e);}
  hideCloudLoad();
  if(pulled)toast('✅ تم تنزيل '+pulled+' صورة فاتورة من السحابة');
  else toast('ℹ️ كل الصور موجودة على الجهاز بالفعل — لو لسه مش ظاهرة جرّب تحدّث الصفحة');
}

/* --- دفع كل البيانات المحلية إلى السحابة --- */
async function cloudPushAll(silent){if(!sb||!cloud.enabled)return;if(state&&state._cloudResetPending&&silent)return;
  if(!silent)showCloudLoad('⏫ جاري رفع الشركات…');
  /* الشركات: رفع دفعة واحدة */
  if(!_bulkSynced||!silent){try{const comps=state.companies.map(c=>({id:c.id,name:c.name,tax_number:c.taxNumber||null}));if(comps.length){const uc=await sb.from('companies').upsert(comps,{onConflict:'id'});if(uc.error)console.warn('push companies',uc.error);}}catch(e){console.warn('companies',e);}}
  const rowsRaw=[];const atts=[];for(const c of state.companies){for(const y of c.years){for(const qk in y.quarters){const q=y.quarters[qk];for(const kind of ['purchases','returns','sales']){const bucket=kind==='sale'?'sales':(kind==='return'?'returns':'purchases');for(const r of (q[bucket]||[])){if(r&&(r.localOnly||isDeleted(r.id)))continue;/* فواتير محلية فقط (معتمدة) ما ترجعش للسحابة */const type=kind==='purchases'?'purchase':(kind==='returns'?'return':'sale');rowsRaw.push(serialiseInvoice(r,type,y.year,parseInt(qk),c.id));if(r.attachmentId&&!r.attachmentUrl)atts.push({id:r.attachmentId,rowId:r.id});}}}}}
  /* شيل أي فاتورة مكررة بنفس الـ id — التكرار بيتعب القاعدة ويرفض الدفعة */
  const _seenRow={};const rows=rowsRaw.filter(x=>{if(!x||!x.id)return false;if(_seenRow[x.id])return false;_seenRow[x.id]=1;return true;});
  if(rows.length){if(!silent)showCloudLoad('⏫ جاري رفع '+rows.length+' فاتورة…');
    if(_ccColMissing)rows.forEach(x=>{if(x)delete x.cost_center;});
    /* رفع الفواتير على دفعات أصغر + إعادة محاولة فردية لو الدفعة فشلت */
    for(let i=0;i<rows.length;i+=150){const chunk=rows.slice(i,i+150);let up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});
      if(up.error&&_isCcColErr(up.error)){
        /* عمود مركز التكلفة ناقص — نحاول إضافته، ولو ماقدرناش نرفع بدونه */
        const fixed=await ensureCostCenterColumn();
        if(fixed){up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});try{await pushCcQueue();}catch(e){}}
        if(up.error&&_isCcColErr(up.error)){_ccColMissing=true;rows.forEach(x=>{if(x&&x.cost_center){_ccQueue[x.id]=x.cost_center;delete x.cost_center;}});chunk.forEach(x=>{if(x)delete x.cost_center;});ccQueueSave();up=await sb.from('invoices').upsert(chunk,{onConflict:'id'});}
      }
      if(up.error){console.warn('push invoices',up.error);
        /* لو الدفعة فشلت، جرّب كل صف لوحده عشان نعرف المتعب ونحفظ الباقي */
        let oneFail=0,oneOk=0;
        for(const row of chunk){const u1=await sb.from('invoices').upsert(row,{onConflict:'id'});if(u1.error){oneFail++;}else{oneOk++;}}
        if(!silent)toast(oneOk?('⚠️ نُقلت '+oneOk+' فاتورة وفشلت '+oneFail):('⚠️ تعذر رفع '+oneFail+' فاتورة'));
        if(!oneOk&&oneFail){break;} /* لو كلها فشلت نتوقف */
      }}}
  /* الموردين: رفع دفعة واحدة (بدل 170 طلب منفصل) */
  if(!_bulkSynced||!silent){try{if(!silent)showCloudLoad('⏫ جاري رفع الموردين…');const _seenSup={};const sups=state.suppliers.map(s=>({id:s.id,name:s.name,tax_number:s.taxNumber||null})).filter(s=>{if(!s.id||_seenSup[s.id])return false;_seenSup[s.id]=1;return true;});for(let i=0;i<sups.length;i+=200){const chunk=sups.slice(i,i+200);const us=await sb.from('suppliers').upsert(chunk,{onConflict:'id'});if(us.error){console.warn('push suppliers',us.error);break;}}}catch(e){console.warn('suppliers',e);}
  await cloudSaveSetting('vat_rate',VAT_RATE);
  await cloudSaveAICfg();
  await cloudSaveCostCentersList();
  }
  _bulkSynced=true;
  /* المرفقات (صور): ترفع في الخلفية بعد ما تقفل النافذة */
  if(!silent){hideCloudLoad();toast('✅ تم رفع '+state.companies.length+' شركة و'+rows.length+' فاتورة للسحابة');}
  if(atts.length){for(const a of atts){try{const blob=await getFile(a.id);if(!blob)continue;const url=await cloudUploadAttachment({name:a.id+'.jpg',dataURL:await blobToDataURL(blob)});if(url){const upd=await sb.from('invoices').update({attachment_url:url}).eq('id',a.rowId);if(!upd.error){for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){const q=y.quarters[qk];for(const b of ['purchases','returns','sales'])for(const r of (q[b]||[])){if(r.id===a.rowId)r.attachmentUrl=url;}}}}}catch(e){console.warn('push att',e);}}saveState();}
}

/* ====== مزامنة صور الفواتير تلقائيًا (رفع + تنزيل) ====== */
let _attSyncing=false;
async function autoSyncAttachments(silent){
  if(!sb||!cloud.enabled||_attSyncing)return;
  _attSyncing=true;
  let uploaded=0,downloaded=0;
  try{
    /* 1) رفع أي صورة محفوظة محليًا ولسه مالهاش رابط سحابي */
    for(const c of state.companies)for(const y of c.years)for(const qk in y.quarters){
      const q=y.quarters[qk];
      for(const b of ['purchases','returns','sales']){
        for(const r of (q[b]||[])){
          if(r.attachmentId && !r.attachmentUrl && !r.localOnly && !isDeleted(r.id)){
            try{
              const blob=await getFile(r.attachmentId);
              if(!blob)continue;
              const url=await cloudUploadAttachment({name:r.attachmentId+'.jpg',dataURL:await blobToDataURL(blob)});
              if(url){ r.attachmentUrl=url; try{await sb.from('invoices').update({attachment_url:url}).eq('id',r.id);}catch(e){} uploaded++; }
            }catch(e){console.warn('att upload',e);}
          }
        }
      }
    }
  }catch(e){console.warn('autoSyncAttachments up',e);}
  /* 2) تنزيل صور الموبايل الجديدة للجهاز */
  try{ const ch=await downloadRemoteAttachments(); if(ch)downloaded++; }catch(e){}
  try{ saveState(); }catch(e){}
  _attSyncing=false;
  if(!silent && (uploaded||downloaded))toast('📎 تمت مزامنة الصور'+(uploaded?(' • رُفع '+uploaded):'')+(downloaded?' • تنزيل جديد':''));
}

/* مؤقّت مزامنة دوري (شبكة أمان لو المزامنة اللحظية انقطعت) */
let _autoSyncTimer=null;
function startAutoSyncLoop(){

    if(!session)return; /* ما نعملش مزامنة وريستارت وإحنا على شاشة الدخول */

    }
  },45000);
}

/* --- المزامنة اللحظية --- */
function cloudUnsubscribe(){if(rtChannel&&sb){try{sb.removeChannel(rtChannel);}catch(e){}rtChannel=null;}}
function cloudSubscribe(){if(!sb)return;cloudUnsubscribe();applyingRemote=true;rtChannel=sb.channel('vat_realtime').on('postgres_changes',{event:'*',schema:'public',table:'invoices'},(p)=>{const r=p.new||p.old;if(!r)return;const k=r.kind==='sale'?'sale':(r.kind==='return'?'return':'purchase');try{if(p.eventType==='DELETE'){removeRow(k,p.old,true);}else{applyRow(k,r,true);if(isOwner()&&r&&r.status==='approved'){scheduleCollectApproved();}}/* نعدّ الفواتير الجديدة فقط (INSERT) عشان التحديثات ورواجع الرفع ما تعملش إشعار */scheduleRealtimeRefresh(p.eventType==='INSERT'?1:0);}catch(e){console.warn('rt',e);}}).on('postgres_changes',{event:'*',schema:'public',table:'companies'},(p)=>{try{const r=p.new||p.old;if(!r)return;let c=state.companies.find(x=>x.id===r.id);if(!c&&p.eventType!=='DELETE'){c={id:r.id,name:r.name,taxNumber:r.tax_number||'',years:[]};state.companies.push(c);}else if(c){c.name=r.name;c.taxNumber=r.tax_number||'';}saveStateLocal();scheduleRealtimeRefresh(0);}catch(e){}}).subscribe((s)=>{setTimeout(()=>{applyingRemote=false;},1500);});}

  +'<button class="ghost sm" style="color:#f87171" onclick="stopCloud();closeModal();">⏸️ إيقاف المزامنة</button>'
  +'<button class="ghost sm" onclick="closeModal()">إغلاق</button></div>'
  +(state._cloudResetPending?'<div style="margin-top:14px;padding:12px;border:1px solid #f59e0b;border-radius:10px;background:rgba(245,158,11,.1);color:#fcd34d;font-size:13px;line-height:1.7">⚠️ في بيانات مستوردة على هذا الجهاز لسه ما اترفعتش للسحابة. اضغط زر إعادة الضبط تحت.</div>':'')
  +'<div style="margin-top:16px;padding-top:14px;border-top:1px dashed #2a3550">'
  +'<p style="color:#8b98b8;font-size:12px;line-height:1.7;margin:0 0 10px">🗑️ مسح كل البيانات من السحابة نهائيًا وترجيع البرنامج جديد فاضي. الزر ده <b>مابيرفعش أي حاجة تاني</b> — بعده اعمل «⬆️ استرجاع» للنسخة الاحتياطية والمزامنة التلقائية هترفعها لوحدها.</p>'
  +'<button class="btn" style="background:#dc2626;border-color:#dc2626" onclick="cloudWipeAndReset()">🗑️ مسح السحابة خالص وتفريغ البرنامج</button></div>'
  +'<p style="color:#7c8aa8;font-size:12px;margin-top:14px;line-height:1.6">🔒 المفتاح العام آمن للنشر في المتصفح (محمي بسياسات القاعدة). مفتاح service_role سرّي ولا يوضع هنا أبدًا.<br>♻️ المزامنة تشتغل تلقائيًا: أول ما تفتح البرنامج، ومع كل فاتورة تضيفها، وكل 45 ثانية، مع رفع وتنزيل صور الفواتير.</p>';showModal(html);}
async function saveCloudAndStart(){const u=val('cl_url').trim().replace(/\/$/,'');const k=val('cl_key').trim();const cid=val('cl_company');if(!u||!k){toast('⚠️ اكتب الرابط والمفتاح');return;}cloud.url=u;cloud.key=k;cloud.companyId=cid||null;await loadSupaLib();try{sb=window.supabase.createClient(u,k);}catch(e){sb=null;}if(!sb){toast('⚠️ تعذر الاتصال — راجع الرابط والمفتاح');return;}closeModal();await startCloud();startAutoSyncLoop();}

loadCloudCfg();
/* --- اتصال تلقائي بالكامل: لو المفاتيح محفوظة يتصل ويزامن لوحده --- */
async function cloudAutoStart(){if(!cloud.url||!cloud.key)return;await loadSupaLib();if(!(window.supabase&&window.supabase.createClient))return;await cloudInit();if(!sb){cloud.enabled=false;markCloud();return;}cloud.enabled=true;try{await flushCloudDeletes();}catch(e){console.warn('flush del',e);}try{await ensureCostCenterColumn();}catch(e){}try{await cloudLoadAll();}catch(e){console.warn('auto load',e);}try{await pushCcQueue();}catch(e){}/* رفع بيانات هذا الجهاز للسحابة تلقائيًا (كانت ناقصة) */try{await cloudPushAll(true);}catch(e){console.warn('auto push',e);}for(const c of state.companies){try{await cloudSaveCompany(c.id);}catch(e){}}try{await cloudSaveAICfg();}catch(e){}try{await autoSyncAttachments(true);}catch(e){}try{cloudSubscribe();}catch(e){}startAutoSyncLoop();markCloud();render();toast('☁️ تم الاتصال التلقائي والمزامنة');}
setTimeout(cloudAutoStart,400);
/* إعادة المحاولة لما يرجع النت أو يرجع للصفحة */
window.addEventListener('online',()=>{if(cloud.enabled){cloudPushAllSoon();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.enabled){try{cloudLoadAll().then(()=>autoSyncAttachments(true)).catch(()=>{});}catch(e){}}});
</script>
