<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script data-cf-adapter="1">
/* ====================================================================
   طبقة توافق Cloudflare — تحاكي واجهة مكتبة Supabase JS
   تخلّي البرنامج يكلّم الـWorker بدل Supabase بدون تغيير منطق البرنامج.
   تعرّف window.supabase.createClient(url,key) زي المكتبة الأصلية.
   url = عنوان الـWorker   |   key = APP_KEY
   ==================================================================== */
(function(){
  if (window.__cfAdapter) return; window.__cfAdapter = true;
  function strip(u){ return String(u||'').replace(/\/+$/,''); }

  function makeClient(url, key){
    var BASE = strip(url), KEY = key || '';
    function api(path, opts){
      opts = opts || {}; opts.headers = opts.headers || {};
      opts.headers['x-app-key'] = KEY;
      if (opts.json !== undefined){ opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(opts.json); delete opts.json; }
      return fetch(BASE + path, opts).then(function(r){
        return r.json().then(function(j){ return j; }, function(){ return { data:null, error:{ message:'bad json' } }; });
      }, function(e){ return { data:null, error:{ message:String(e && e.message || e) } }; });
    }

    function qb(table){
      var st = { table:table, op:'select', columns:'*', filters:[], order:null, limit:null, row:null, rows:null, set:null, onConflict:null, single:false, returning:false };
      var p = {
        select:function(c){ if (st.op==='select'){ st.columns = c || '*'; } else { st.returning = true; } return p; },
        insert:function(r){ st.op='insert'; if (Array.isArray(r)) st.rows=r; else st.row=r; return p; },
        upsert:function(r,o){ st.op='upsert'; if (Array.isArray(r)) st.rows=r; else st.row=r; st.onConflict=(o&&o.onConflict)||'id'; return p; },
        update:function(s){ st.op='update'; st.set=s; return p; },
        delete:function(){ st.op='delete'; return p; },
        eq:function(c,v){ st.filters.push({col:c,op:'eq',val:v}); return p; },
        neq:function(c,v){ st.filters.push({col:c,op:'not_eq',val:v}); return p; },
        in:function(c,v){ st.filters.push({col:c,op:'in',val:v}); return p; },
        not:function(c,o,v){ st.filters.push({col:c,op:'not_'+o,val:v}); return p; },
        like:function(c,v){ st.filters.push({col:c,op:'like',val:v}); return p; },
        ilike:function(c,v){ st.filters.push({col:c,op:'like',val:v}); return p; },
        gt:function(c,v){ st.filters.push({col:c,op:'gt',val:v}); return p; },
        order:function(c,o){ st.order={col:c, ascending:!(o && o.ascending===false)}; return p; },
        limit:function(n){ st.limit=n; return p; },
        single:function(){ st.single=true; return p; },
        maybeSingle:function(){ st.single=true; return p; },
        then:function(res,rej){ return api('/q',{method:'POST',json:st}).then(res,rej); }
      };
      return p;
    }

    var storage = {
      from:function(bucket){
        return {
          upload:function(path, blob, o){
            return fetch(BASE + '/object/public/' + bucket + '/' + encodeURI(path), {
              method:'PUT',
              headers:{ 'x-app-key':KEY, 'content-type':(o && o.contentType) || (blob && blob.type) || 'application/octet-stream' },
              body: blob
            }).then(function(r){ return r.ok ? { data:{ path:path }, error:null } : { data:null, error:{ message:'upload failed '+r.status } }; },
              function(e){ return { data:null, error:{ message:String(e) } }; });
          },
          getPublicUrl:function(path){ return { data:{ publicUrl: BASE + '/object/public/' + bucket + '/' + encodeURI(path) } }; },
          download:function(path){
            return fetch(BASE + '/object/public/' + bucket + '/' + encodeURI(path), { headers:{ 'x-app-key':KEY } })
              .then(function(r){ return r.ok ? r.blob().then(function(bl){ return { data:bl, error:null }; }) : { data:null, error:{ message:'not found' } }; },
                function(e){ return { data:null, error:{ message:String(e) } }; });
          },
          remove:function(paths){ return api('/storage/remove',{method:'POST',json:{ bucket:bucket, paths:paths }}); },
          list:function(prefix,o){ return api('/storage/list',{method:'POST',json:{ bucket:bucket, prefix:prefix||'', limit:(o&&o.limit)||100, offset:(o&&o.offset)||0 }}); }
        };
      }
    };

    function rpc(fn, params){ return api('/rpc',{method:'POST',json:{ fn:fn, params:params||{} }}); }

    /* محاكاة Realtime عبر polling على /changes */
    var channels=[], poller=null, since=Date.now(), seen={ invoices:{}, companies:{} };
    function startPoll(){ if (poller) return; poller=setInterval(pollOnce, 7000); }
    function pollOnce(){
      api('/changes?since='+since, { method:'GET' }).then(function(j){
        if (!j || j.error) return;
        if (j.ts) since = j.ts;
        ['invoices','companies'].forEach(function(tbl){
          (j[tbl]||[]).forEach(function(row){
            var isNew = !seen[tbl][row.id]; seen[tbl][row.id]=1;
            fire(tbl, { eventType:isNew?'INSERT':'UPDATE', new:row, old:row, table:tbl });
          });
        });
        (j.deletions||[]).forEach(function(d){ fire(d.table_name, { eventType:'DELETE', old:{ id:d.id }, new:null, table:d.table_name }); });
      }, function(){});
    }
    function fire(tbl, payload){ channels.forEach(function(ch){ ch.handlers.forEach(function(h){ if (h.table===tbl){ try{ h.cb(payload); }catch(e){} } }); }); }
    function channel(name){
      var ch = { name:name, handlers:[],
        on:function(type, filter, cb){ ch.handlers.push({ table: filter && filter.table, cb:cb }); return ch; },
        subscribe:function(cb){ channels.push(ch); startPoll(); if (cb){ try{ cb('SUBSCRIBED'); }catch(e){} } return ch; }
      };
      return ch;
    }
    function removeChannel(ch){ var i=channels.indexOf(ch); if (i>=0) channels.splice(i,1); if (!channels.length && poller){ clearInterval(poller); poller=null; } }

    return { from:qb, storage:storage, rpc:rpc, channel:channel, removeChannel:removeChannel };
  }

  window.supabase = { createClient:function(u,k){ return makeClient(u,k); } };
})();

</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج الإقرارات الضريبية - المشتريات والمبيعات</title>
<style>
:root{--bg:#0e1526;--panel:#161f33;--card:#1e293f;--accent:#6366f1;--accent2:#4f46e5;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#e8edf7;--muted:#93a0b5;--border:#2a3650;--hover:#232f4a;--activebg:#283462;--radius:14px;--shadow:0 6px 20px rgba(0,0,0,.28)}
body.light{--bg:#eef2f7;--panel:#ffffff;--card:#f6f8fc;--accent:#4f46e5;--accent2:#4338ca;--green:#059669;--red:#dc2626;--amber:#d97706;--text:#1e293b;--muted:#64748b;--border:#e3e8f0;--hover:#eef2ff;--activebg:#e0e7ff;--shadow:0 6px 20px rgba(30,41,59,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;transition:.15s;color:#fff;background:var(--accent)}
button:hover{background:var(--accent2)}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button.ghost:hover{background:var(--card)}
button.green{background:var(--green)}
button.red{background:var(--red)}
button.amber{background:var(--amber)}
button.sm{padding:5px 10px;font-size:12.5px}
input,select{font-family:inherit;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:9px;font-size:14px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.hidden{display:none!important}
/* header */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:800}
.topbar .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#16a34a);display:grid;place-items:center;font-size:18px}
.spacer{flex:1}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:270px;background:var(--panel);border-left:1px solid var(--border);padding:16px;overflow:auto}
.main{flex:1;padding:20px;overflow:auto}
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;font-size:14px}
.breadcrumb a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:700}
.breadcrumb span{color:var(--muted)}
.sec-title{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 10px}
.company-item,.year-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.12s}
.company-item:hover,.year-item:hover{border-color:var(--accent)}
.company-item.active{border-color:var(--accent);background:var(--activebg)}
.company-item .nm{font-weight:700;font-size:14px}
.company-item .tx{font-size:11.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
/* جداول الفواتير: تظهر كل الأعمدة وتتلف داخل عرض الشاشة بدون تمرير أفقي */
.tbl-wrap.fit{overflow:visible}
table.fit{min-width:0;font-size:11.5px;table-layout:auto}
table.fit th,table.fit td{white-space:normal;word-break:normal;overflow-wrap:normal;padding:4px 6px;line-height:1.3;vertical-align:middle}
table.fit td.num{white-space:nowrap}
table.fit td.nowrap,table.fit th.nowrap{white-space:normal;word-break:normal;overflow-wrap:normal}
@media(max-width:1200px){table.fit{font-size:10.5px}table.fit th,table.fit td{padding:3px 5px}}
@media(max-width:860px){table.fit{font-size:9.5px}table.fit th,table.fit td{padding:2px 4px}}
th{background:var(--card);color:var(--muted);font-weight:700;position:sticky;top:0}
tr:hover td{background:var(--hover)}
table.compact th,table.compact td{padding:3px 6px;line-height:1.2;vertical-align:middle}
table.compact .muted{font-size:10px;line-height:1.15}
table.compact .sm{padding:2px 7px;font-size:11px}
table.compact .chip{padding:1px 6px;font-size:10.5px}
.pend-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.pend-filters input,.pend-filters select{width:auto;padding:6px 9px;font-size:12px;border-radius:7px}
.pend-filters input{flex:1;min-width:150px}
.pend-filters select{max-width:160px}
.pend-filters .sm{padding:6px 10px;font-size:12px}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
.tfoot td{background:var(--card);font-weight:800}
.empty{text-align:center;color:var(--muted);padding:28px}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.stat .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.g{border-color:#14532d}.stat.g .val{color:#4ade80}
.stat.r{border-color:#7f1d1d}.stat.r .val{color:#f87171}
.result-box{border-radius:14px;padding:20px;text-align:center;margin-top:14px;font-size:16px;font-weight:700}
.result-box.owe{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5}
.result-box.credit{background:#052e16;border:1px solid #14532d;color:#86efac}
.result-box.suspect{background:#422006;border:1px solid #92400e;color:#fcd34d}
.result-box .big{font-size:30px;display:block;margin-top:6px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:620px;max-height:90vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.chip{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11.5px;color:var(--muted);word-break:normal;overflow-wrap:normal}
.att-link{color:var(--accent);cursor:pointer;font-weight:700;font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:12px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:600}
.ai-drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.ai-drop:hover{border-color:var(--accent);color:var(--text)}
.qlayout{display:flex;gap:16px;align-items:flex-start}
.qtabs{display:flex;flex-direction:column;gap:8px;width:220px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);position:sticky;top:14px}
.qbody{flex:1;min-width:0}
.tab{padding:12px 14px;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--muted);font-weight:700;cursor:pointer;font-size:14px;text-align:right;display:flex;align-items:center;gap:9px;transition:.14s}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(99,102,241,.35)}
@media(max-width:720px){.qlayout{flex-direction:column}.qtabs{width:100%;flex-direction:row;flex-wrap:wrap;position:static}.tab{flex:1;justify-content:center}}
.muted{color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
@media(max-width:820px){.layout{flex-direction:column}.sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border)}.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}
#modalRoot .field{margin-bottom:12px}#modalRoot .field label{display:block;font-size:13px;color:#8b98b8;margin-bottom:6px}#modalRoot .field input,#modalRoot .field select{width:100%;box-sizing:border-box}#modalRoot .btn{padding:12px 18px;border-radius:10px;border:0;background:var(--accent,#3b82f6);color:#fff;font-weight:700;cursor:pointer;font-size:14px}#modalRoot .ghost{border:1px solid var(--border,#26324f);background:transparent;color:inherit;font-weight:600}
/* شاشة تسجيل الدخول */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--card,#131b30);border:1px solid var(--border,#26324f);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card h2{justify-content:center;text-align:center;margin:6px 0 4px}
.login-card .lg-logo{font-size:46px;text-align:center}
.login-card .field{margin-bottom:14px}
.login-card label{display:block;font-size:13px;color:#8b98b8;margin-bottom:6px}
.login-card input{width:100%;box-sizing:border-box}
.login-card .btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent,#3b82f6);color:#fff;font-weight:800;cursor:pointer;font-size:15px}
.login-err{color:#f87171;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.topbar .who{font-size:12.5px;color:#8b98b8;white-space:nowrap}
.topbar .who b{color:var(--fg,#e6ecff)}
.pend-badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:#f59e0b;color:#111;font-weight:800;font-size:12px;margin-inline-start:6px}
.pend-badge.zero{background:#334155;color:#94a3b8}
.side-btn{width:100%;margin-bottom:8px}
.gate-note{font-size:12.5px;color:#8b98b8;line-height:1.8;margin-top:8px}
/* ===== لوحة مراجعة المرفق الجانبية (جنب الجدول + مكبّر بالماوس) ===== */
.att-side{position:fixed;top:0;left:0;bottom:0;width:460px;max-width:92vw;background:var(--panel);border-right:1px solid var(--border);box-shadow:8px 0 28px rgba(0,0,0,.4);z-index:45;display:flex;flex-direction:column}
body.att-side-open .topbar,body.att-side-open .layout{margin-left:460px;transition:margin .15s ease}
.att-side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap}
.att-side-head b{font-size:15px}
.att-side-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.att-side-tools button,.att-side-tools a{padding:6px 10px;font-size:13px}
.att-side-body{flex:1;overflow:auto;background:#0b1220;display:flex;flex-direction:column}
.att-zoom{position:relative;overflow:hidden;background:#0b1220;flex:1;min-height:260px;cursor:zoom-in;display:flex;align-items:center;justify-content:center}
.att-zoom img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;transition:transform .07s ease-out;transform-origin:center center;user-select:none;-webkit-user-drag:none}
.att-zoom.zooming img{cursor:crosshair}
.att-data{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:8px 11px;border-bottom:1px solid var(--border);background:var(--panel)}
.att-drow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--border);font-size:11.5px;line-height:1.35;min-width:0}
.att-drow.wide{grid-column:1 / -1}
.att-dlbl{color:var(--muted);flex:0 0 auto;font-size:11px}
.att-dval{font-weight:600;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
.att-amts{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:3px}
.att-amt{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:4px 5px;text-align:center}
.att-amt .l{display:block;color:var(--muted);font-size:10px;margin-bottom:1px}
.att-amt .v{font-weight:700;font-size:12px}
body.att-side-open .tbl-wrap.fit{overflow:auto}
body.att-side-open table.fit{min-width:980px}
body.att-side-open table.fit th,body.att-side-open table.fit td{white-space:nowrap;word-break:normal;overflow-wrap:normal}
@media(max-width:820px){.att-side{width:100%;max-width:100%}body.att-side-open .topbar,body.att-side-open .layout{margin-left:0}}
.att-side-actions{display:flex;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:2}
.att-side-actions button{flex:1;padding:12px 8px;font-size:14px;font-weight:800}
.att-side-actions .note{color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">🧾</div>
  <h1>نظام الإقرارات الضريبية</h1>
  <div class="spacer"></div>
  <span class="who" id="whoBox"></span>
  <button class="ghost sm" id="pendBtn" onclick="openPending()">⏳ الفواتير المعلّقة<span class="pend-badge zero" id="pendBadge">0</span></button>
  <button class="ghost sm" id="usersBtn" data-admin-only onclick="openUsers()">👤 المستخدمون</button>
  <button class="ghost sm" id="themeBtn" onclick="toggleTheme()">🌙 الوضع الداكن</button>
  <button class="ghost sm" id="cloudBtn" data-admin-only onclick="openCloudSettings()">☁️ المزامنة السحابية</button>
  <button class="ghost sm" data-admin-only onclick="openAISettings()">⚙️ الإعدادات والذكاء الاصطناعي</button>
  <button class="ghost sm" data-admin-only onclick="openBackupSettings()">📂 النسخ التلقائي</button>
  <button class="ghost sm" data-admin-only onclick="exportAll()">⬇️ نسخة احتياطية</button>
  <button class="ghost sm" data-admin-only onclick="document.getElementById('importFile').click()">⬆️ استرجاع</button>
  <button class="ghost sm" id="logoutBtn" style="color:#f87171" onclick="logout()">🚪 خروج</button>
  <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importAll(this)">
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="sec-title">الشركات</div>
    <button class="green sm" style="width:100%;margin-bottom:12px" onclick="openCompanyModal()">➕ إضافة شركة</button>
    <div id="companyList"></div>
    <div class="sec-title" style="margin-top:22px">دليل الموردين</div>

<script>
/* ============ تخزين البيانات ============ */

const ADMIN_KEY='983682912355d6bea26eedb108af3915265afe1b52b44255';
const SESSION_KEY='vat_desk_session_v1';
let session=null;            /* {id,username,name,role,companyId,costCenter} */
let pendingRows={};          /* id -> صف الفاتورة المعلّقة/المرفوضة (من السحابة) */
function loadSession(){try{const r=localStorage.getItem(SESSION_KEY);if(r){session=JSON.parse(r);}if(session&&(!session.username||!session.role))session=null;}catch(e){session=null;}}

let _collectTimer=null;
function scheduleCollectApproved(){if(!isOwner())return;try{clearTimeout(_collectTimer);}catch(e){}_collectTimer=setTimeout(()=>{collectApprovedToOwner().catch(()=>{});},2000);}
async function collectApprovedToOwner(){
  /* 💾 جهاز المالك (omarfix26) بس هو اللي ينقل الفواتير المعتمدة من السحابة لعنده ويشيلها بعد التأكد إنها اتخزنت.
     المراجعون يعتمدوا بس — الفاتورة تفضل في السحابة لحد ما توصل المالك، فماتضيعش لو كان قافل. */
  if(!sb||!cloud.enabled||!isOwner())return;
  let rows=[];
  try{const res=await sb.from('invoices').select('*').eq('status','approved');if(res.error||!res.data)return;rows=res.data;}catch(e){return;}
  if(!rows.length)return;
  let changed=false;
  for(const row of rows){
    try{
      if(!row||!row.id||isDeleted(row.id))continue;
      const k=row.kind==='sale'?'sale':(row.kind==='return'?'return':'purchase');
      setFromRow(k,row,row.year,row.quarter);
      const localRow=findLocalInvoiceById(row.id);
      if(!localRow)continue;
      const attUrl=row.attachment_url||'';
      const localOk=await pullApprovedAttachment(localRow,attUrl);
      if(!localOk)continue;/* الصورة لسه ماتخزنتش محلياً — نسيبها في السحابة لحد المرة الجاية */
      localRow.localOnly=true;
      if(row.approved_by)setApprover(row.id,row.approved_by);
      try{await cloudDeleteInvoice(row.id,attUrl);}catch(e){console.warn('owner purge',e);continue;}
      changed=true;
    }catch(e){console.warn('collectApprovedToOwner row',e);}
  }
  if(changed){saveStateLocal();if(!applyingRemote){try{render();}catch(e){}}}
}
/* الشركات المسموح للمراجع بمراجعتها (قد تكون أكثر من شركة) */

async function loadReviewerCompanies(){try{await ensureSb();if(!sb||!session||!session.username)return;var res=await sb.from('app_settings').select('value').eq('key','reader_companies::'+session.username).limit(1);if(res&&res.data&&res.data[0]){var arr=JSON.parse(res.data[0].value||'[]');if(Array.isArray(arr)){session.companies=arr.map(String);saveSession();}}}catch(e){console.warn('loadReviewerCompanies',e);}}
function roleLabel_unused(){}
/* نسبة الضريبة الموحّدة (قابلة للتعديل من الإعدادات) */
let VAT_RATE=15;
function applyVatRate(v){VAT_RATE=num(v);if(!(VAT_RATE>=0))VAT_RATE=15;}
const QUARTERS=[
  {n:1,name:'الربع الأول',months:'يناير - مارس'},
  {n:2,name:'الربع الثاني',months:'أبريل - يونيو'},
  {n:3,name:'الربع الثالث',months:'يوليو - سبتمبر'},
  {n:4,name:'الربع الرابع',months:'أكتوبر - ديسمبر'}
];
function qName(n){const q=QUARTERS.find(x=>x.n===n);return q?q.name:'ربع '+n;}
/* تطبيع البيانات: كل سنة لازم تحتوي 4 أرباع */
function emptyQuarter(){return {purchases:[],returns:[],sales:[],docs:[]};}
function normalizeData(){
  state.companies.forEach(c=>{(c.years||[]).forEach(y=>{
    if(!y.quarters){
      y.quarters={1:emptyQuarter(),2:emptyQuarter(),3:emptyQuarter(),4:emptyQuarter()};
      // ترحيل أي بيانات قديمة إلى الربع الأول
      if(y.purchases&&y.purchases.length)y.quarters[1].purchases=y.purchases;
      if(y.returns&&y.returns.length)y.quarters[1].returns=y.returns;
      if(y.sales&&y.sales.length)y.quarters[1].sales=y.sales;
    }
    [1,2,3,4].forEach(n=>{if(!y.quarters[n])y.quarters[n]=emptyQuarter();['purchases','returns','sales','docs'].forEach(k=>{if(!y.quarters[n][k])y.quarters[n][k]=[];});});
    delete y.purchases;delete y.returns;delete y.sales;
  });});
}

function applyLoadedData(d){try{state=Object.assign(state,d);if(!state.aiCfg)state.aiCfg={endpoint:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini',key:''};migrateAIModel();if(!state.suppliers)state.suppliers=[];if(!state.costCenters)state.costCenters=[];if(!state.theme)state.theme='dark';if(!state.vatRate||!(state.vatRate>=0))state.vatRate=15;}catch(e){console.warn(e);}}
function loadState(){try{const r=localStorage.getItem(LS_KEY);if(r){applyLoadedData(JSON.parse(r));}}catch(e){console.warn(e);}}
/* ============ تخزين البيانات في IndexedDB (مساحة كبيرة بدل حدّ 5 ميجا في localStorage) ============ */
const STATE_DB='vat_state_db', STATE_STORE='state';
let _stateDB=null;
function stateDBOpen(){return new Promise((res,rej)=>{if(_stateDB)return res(_stateDB);try{const r=indexedDB.open(STATE_DB,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STATE_STORE))db.createObjectStore(STATE_STORE);};r.onsuccess=e=>{_stateDB=e.target.result;res(_stateDB);};r.onerror=e=>rej(r.error||e);}catch(e){rej(e);}});}
function idbSaveStateNow(){return new Promise((res,rej)=>{stateDBOpen().then(db=>{try{const data=JSON.stringify(state);const t=db.transaction(STATE_STORE,'readwrite');t.objectStore(STATE_STORE).put(data,'main');t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}catch(e){rej(e);}}).catch(rej);});}
let _stateSaveTimer=null;
function idbSaveStateDebounced(){clearTimeout(_stateSaveTimer);_stateSaveTimer=setTimeout(()=>{idbSaveStateNow().catch(e=>console.warn('idb state save',e));},250);}
async function idbLoadStateRaw(){try{const db=await stateDBOpen();return await new Promise(res=>{try{const t=db.transaction(STATE_STORE,'readonly');const rq=t.objectStore(STATE_STORE).get('main');rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}});}catch(e){return null;}}
async function loadStatePersisted(){
  let raw=await idbLoadStateRaw();
  let fromLS=false;
  if(!raw){try{raw=localStorage.getItem(LS_KEY);}catch(e){raw=null;}fromLS=!!raw;}
  if(raw){try{applyLoadedData(JSON.parse(raw));}catch(e){console.warn('parse state',e);}}
  if(fromLS){try{await idbSaveStateNow();}catch(e){}}
}
function migrateAIModel(){try{const a=state.aiCfg;if(!a)return;const ep=(a.endpoint||'');const isGemini=ep.includes('generativelanguage.googleapis.com');const dead=['gemini-2.0-flash','gemini-2.0-flash-001','gemini-1.5-flash','gemini-1.5-pro','gemini-2.5-flash','gemini-pro-vision'];if(isGemini&&dead.includes((a.model||'').trim())){a.model='gemini-flash-latest';}if(!Array.isArray(a.keys))a.keys=[];if(a.key&&!a.keys.includes(a.key))a.keys.unshift(a.key);a.keys=a.keys.map(k=>(k||'').trim()).filter(Boolean);if(!a.key&&a.keys.length)a.key=a.keys[0];if(typeof a.flash==='undefined')a.flash=true;}catch(e){}}
/* ===== تخزين منفصل للإعدادات (مفاتيح الذكاء الاصطناعي/النسبة/المظهر) =====
   عشان المفاتيح والإعدادات تتحفظ دايماً حتى لو حفظ البيانات الكبيرة فشل */
const SETTINGS_KEY='vat_settings_v1';
function saveSettingsLocal(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({aiCfg:state.aiCfg,vatRate:state.vatRate,theme:state.theme,lastBackup:state.lastBackup}));return true;}catch(e){return false;}}
function loadLocalSettings(){try{const r=localStorage.getItem(SETTINGS_KEY);if(r){const s=JSON.parse(r);if(s.aiCfg)state.aiCfg=s.aiCfg;if(typeof s.vatRate!=='undefined'&&s.vatRate!==null)state.vatRate=s.vatRate;if(s.theme)state.theme=s.theme;if(s.lastBackup)state.lastBackup=s.lastBackup;}}catch(e){}}
/* تنظيف الحقول الزائدة من الفواتير لتصغير الحجم عند امتلاء المساحة */
function compactState(){
  (state.companies||[]).forEach(c=>(c.years||[]).forEach(y=>{[1,2,3,4].forEach(n=>{const q=y.quarters&&y.quarters[n];if(!q)return;['purchases','returns','sales'].forEach(k=>{(q[k]||[]).forEach(r=>{if(!r)return;delete r.name;delete r.client;delete r.base;delete r.amount;delete r.beforeVat;delete r.afterVat;delete r.total;if(r.attachmentId&&r.attachmentUrl)delete r.attachmentUrl;});});});}));
}
/* حفظ محلي فقط — من غير أي رفع للسحابة. بنستخدمه لما نطبّق بيانات جاية مِن السحابة
   (عشان ما نعملش حلقة: نرفع ← الاستطلاع يشوفها كتغيير ← نطبّقها ← نرفع تاني ← ... ) */

  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}
  catch(e){try{localStorage.removeItem(LS_KEY);}catch(_){}}

  /* حفظ محلي + رفع للسحابة (لما المستخدم نفسه يعدّل بيانات) */
  saveStateLocal();
  cloudPushAllSoon();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---- المرفقات عبر IndexedDB ---- */
let _db=null;
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open('vat_attachments',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('files');};r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=e=>rej(e);});}
async function putFile(id,blob){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=()=>res();t.onerror=rej;});}
async function getFile(id){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction('files','readonly');const rq=t.objectStore('files').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=rej;});}
async function delFile(id){const db=await openDB();return new Promise((res)=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>res();});}
/* تفريغ كل صور الفواتير المخزّنة محليًا (نحافظ على مجلد النسخ الاحتياطي __backupDir) */
async function clearAllFiles(){const db=await openDB();return new Promise((res)=>{try{const t=db.transaction('files','readwrite');const store=t.objectStore('files');const kr=store.getAllKeys();kr.onsuccess=()=>{const keys=kr.result||[];for(const k of keys){if(k==='__backupDir')continue;try{store.delete(k);}catch(e){}}};t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});}

/* ---- أدوات ---- */
function num(v){v=parseFloat(v);return isNaN(v)?0:v;}
function fmt(v){return num(v).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const r=document.getElementById('toastRoot');const t=document.createElement('div');t.className='toast';t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),2600);}

function getYear(){const c=getCompany();return c&&c.years.find(y=>y.year===sel.year);}
function getQuarter(){const y=getYear();return y&&y.quarters[sel.quarter];}

/* بحث/فلترة داخل الجداول */
function filterTable(inp,tid){const q=(inp.value||'').trim().toLowerCase();const tb=document.querySelector('#'+tid+' tbody');if(!tb)return;if(_rowFilter&&_rowFilter.tid===tid){_rowFilter=null;try{updateFlagLabels(tid);}catch(_){}}Array.from(tb.rows).forEach(row=>{if(row.querySelector('.empty'))return;row.style.display=(!q||row.textContent.toLowerCase().includes(q))?'':'none';});}
/* فلتر: اعرض الصفوف المعلّمة فقط (مكرر أو مشتبه) عند الضغط على التنبيه (toggle) */
var _rowFilter=null; /* {tid, attr} */
function applyRowFilter(tid,attr){const tb=document.querySelector('#'+tid+' tbody');if(!tb)return false;const srch=document.getElementById('search_'+tid);if(srch)srch.value='';Array.from(tb.rows).forEach(row=>{if(row.querySelector('.empty'))return;row.style.display=(row.getAttribute(attr)==='1')?'':'none';});return true;}
function clearRowFilter(tid){const tb=document.querySelector('#'+tid+' tbody');if(!tb)return;Array.from(tb.rows).forEach(row=>{if(row.querySelector('.empty'))return;row.style.display='';});}
function updateFlagLabels(tid){try{const tb=document.querySelector('#'+tid+' tbody');if(!tb)return;const card=tb.closest('.card');card.querySelectorAll('.flag-alert').forEach(a=>{const attr=a.getAttribute('data-attr');const lbl=a.querySelector('.flag-toggle-lbl');if(!lbl)return;const on=_rowFilter&&_rowFilter.tid===tid&&_rowFilter.attr===attr;lbl.textContent=on?'✅ بتعرض المفلتر فقط — اضغط للرجوع للكل 🔁':(attr==='data-dup'?'اضغط هنا لعرض المكرر فقط 🔁':'اضغط هنا لعرض المشتبه فقط 🔁');});}catch(_){}}
function toggleFlagFilter(tid,attr){const active=_rowFilter&&_rowFilter.tid===tid&&_rowFilter.attr===attr;if(active){clearRowFilter(tid);_rowFilter=null;}else{applyRowFilter(tid,attr);_rowFilter={tid:tid,attr:attr};}updateFlagLabels(tid);}
function toggleDupFilter(tid){toggleFlagFilter(tid,'data-dup');}

/* تصدير Excel (.xls متوافق) */
function xlsDownload(name,inner){
  const style='<style>table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt;margin-bottom:14px}'+
    'th{background:#1e3a8a;color:#fff;font-weight:bold;border:1px solid #1e3a8a;padding:6px 10px;text-align:center;mso-number-format:"\\@"}'+
    'td{border:1px solid #94a3b8;padding:5px 10px;vertical-align:middle}'+
    'h3{font-family:Arial;color:#1e3a8a}</style>';
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8">'+style+'</head><body dir="rtl">'+inner+'</body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function xlsCell(c,extra){
  if(typeof c==='number'&&isFinite(c)){return '<td style="mso-number-format:\'#,##0.00\';text-align:right'+(extra||'')+'">'+c+'</td>';}
  // نص (رقم ضريبي/رقم فاتورة) — نجبره كنص عشان ما يظهرش بالصيغة العلمية
  return '<td style="mso-number-format:\'\\@\''+(extra||'')+'">'+(c==null?'':c)+'</td>';
}
function xlsTable(title,headers,rows,totals){
  let h='<h3>'+title+'</h3><table border="1" cellspacing="0" dir="rtl"><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
  rows.forEach(r=>{h+='<tr>'+r.map(c=>xlsCell(c,'')).join('')+'</tr>';});
  if(totals)h+='<tr>'+totals.map(c=>xlsCell(c,';background:#fde68a;font-weight:bold')).join('')+'</tr>';
  return h+'</table><br>';
}
function ctxName(){const c=getCompany(),y=getYear();return (c?c.name:'')+'_'+(y?y.year:'')+'_'+qName(sel.quarter);}
function purchHeaders(){return ['اسم المورد','الرقم الضريبي','تاريخ الفاتورة','رقم الفاتورة','مركز التكلفة','المبلغ قبل الضريبة','الضريبة','الإجمالي شامل'];}
function purchRows(rows){return rows.map(r=>[r.supplierName,r.taxNumber||'',r.invoiceDate||'',r.invoiceNumber||'',r.costCenter||'',num(r.amountExcl),num(r.tax),num(r.amountIncl)]);}
function purchTotals(rows){return ['الإجمالي','','','','',sum(rows,x=>x.amountExcl),sum(rows,x=>x.tax),sum(rows,x=>x.amountIncl)];}
function salesHeaders(){return ['التاريخ','رقم الفاتورة','مركز التكلفة','المبلغ شامل الضريبة','الضريبة','المبلغ قبل الضريبة'];}
function salesRows(rows){return rows.map(r=>[r.date||'',r.invoiceNumber||'',r.costCenter||'',num(r.amountIncl),num(r.tax),num(r.amountBefore)]);}
function salesTotals(rows){return ['الإجمالي','','',sum(rows,x=>x.amountIncl),sum(rows,x=>x.tax),sum(rows,x=>x.amountBefore)];}
function exportPurchases(key){const q=getQuarter();const rows=q[key];const label=key==='returns'?'مردود_مشتريات':'مشتريات';
  xlsDownload(label+'_'+ctxName(),xlsTable('فواتير '+(key==='returns'?'مردود المشتريات':'المشتريات')+' - '+ctxName(),purchHeaders(),purchRows(rows),purchTotals(rows)));toast('✅ تم تصدير ملف Excel');}
function exportSales(){const q=getQuarter();const rows=q.sales;xlsDownload('مبيعات_'+ctxName(),xlsTable('فواتير المبيعات - '+ctxName(),salesHeaders(),salesRows(rows),salesTotals(rows)));toast('✅ تم تصدير ملف Excel');}
function exportQuarterFull(){const q=getQuarter();const t=totalsOf(q);const net=t.salesVat-t.netPurchVat;
  let inner='<h2 style="font-family:Arial">إقرار '+qName(sel.quarter)+' - '+ctxName()+'</h2>';
  inner+=xlsTable('أولاً: المشتريات',purchHeaders(),purchRows(q.purchases),purchTotals(q.purchases));
  inner+=xlsTable('ثانياً: مردود المشتريات',purchHeaders(),purchRows(q.returns),purchTotals(q.returns));
  inner+=xlsTable('ثالثاً: المبيعات',salesHeaders(),salesRows(q.sales),salesTotals(q.sales));
  inner+=xlsTable('رابعاً: الملخص الضريبي',['البيان','القيمة'],[['ضريبة المشتريات',t.pVat],['ضريبة مردود المشتريات',t.rVat],['صافي ضريبة المشتريات',t.netPurchVat],['ضريبة المبيعات',t.salesVat],[(net>0?'مستحق للمصلحة':'رصيد لك'),Math.abs(net)]]);
  xlsDownload('إقرار_'+ctxName(),inner);toast('✅ تم تصدير إقرار الربع كاملاً');}
function exportYearFull(){
  const c=getCompany(),y=getYear();if(!y)return;
  let inner='<h1 style="font-family:Arial">إقرار سنة '+y.year+' - '+esc(c.name)+'</h1>';
  QUARTERS.forEach(qd=>{
    const q=y.quarters[qd.n];const t=totalsOf(q);const net=t.salesVat-t.netPurchVat;
    inner+='<h2 style="font-family:Arial;background:#1e293f;color:#fff;padding:6px">'+qd.name+' ('+qd.months+')</h2>';
    inner+=xlsTable('أولاً: المشتريات',purchHeaders(),purchRows(q.purchases),purchTotals(q.purchases));
    inner+=xlsTable('ثانياً: مردود المشتريات',purchHeaders(),purchRows(q.returns),purchTotals(q.returns));
    inner+=xlsTable('ثالثاً: المبيعات',salesHeaders(),salesRows(q.sales),salesTotals(q.sales));
    inner+=xlsTable('رابعاً: ملخص '+qd.name,['البيان','القيمة'],[['ضريبة المشتريات',t.pVat],['ضريبة مردود المشتريات',t.rVat],['صافي ضريبة المشتريات',t.netPurchVat],['ضريبة المبيعات',t.salesVat],[(net>0?'مستحق للمصلحة':'رصيد لك'),Math.abs(net)]]);
  });
  const yt=yearTotals(y);const ynet=yt.salesVat-yt.netPurchVat;
  inner+='<h2 style="font-family:Arial;background:#4f46e5;color:#fff;padding:6px">الملخص السنوي الإجمالي (كل الأرباع)</h2>';

function render(){

  const _sx=window.pageXOffset||0,_sy=window.pageYOffset||0;
  /* احفظ حالة خانة البحث قبل إعادة البناء عشان ما تتمسحش والمستخدم بيكتب (مثلاً وقت وصول فاتورة من الموبايل) */
  let _srch=null;try{const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&ae.classList.contains('tbl-search')&&m.contains(ae)){_srch={id:ae.id,tid:ae.getAttribute('data-tid'),value:ae.value,s:ae.selectionStart,e:ae.selectionEnd};}}catch(_){}
  if(isReviewer()){m.innerHTML=pendingView();}

  else if(sel.view==='audit'){m.innerHTML=auditView();}
  else if(sel.view==='users'){m.innerHTML=usersView();renderUsersBody();if(!_usersLoaded)loadUsersList();}
  else if(!sel.companyId){m.innerHTML=welcomeView();}
  else if(!sel.year){m.innerHTML=companyView();}
  else if(!sel.quarter){m.innerHTML=yearView();}
  else{m.innerHTML=quarterView();}
  /* رجّع فلاتر الفواتير المعلّقة زي ما كانت (ماتتلغيش عند التحديث) */
  if(isReviewer()||sel.view==='pending'){try{restorePendFilters();}catch(_){}}
  /* رجّع خانة البحث (النص + التركيز + مكان الكيرسر) وأعِد تطبيق الفلترة — بدون ما نسحب الصفحة لفوق */
  if(_srch&&_srch.id){try{const el=document.getElementById(_srch.id);if(el){el.value=_srch.value;try{el.focus({preventScroll:true});}catch(_){el.focus();}try{el.setSelectionRange(_srch.s,_srch.e);}catch(_){}if(_srch.tid)filterTable(el,_srch.tid);}}catch(_){}}
  /* لو فلتر (المكرر/المشتبه فقط) كان شغال قبل التحديث، ارجّعه زي ما كان (مايفكش لوحده عند التحديث التلقائي) */
  if(_rowFilter){try{const _t=_rowFilter.tid,_a=_rowFilter.attr;if(applyRowFilter(_t,_a)){updateFlagLabels(_t);}else{_rowFilter=null;}}catch(_){}}
  /* رجّع مكان التمرير زي ما كان بعد إعادة البناء */
  try{window.scrollTo(_sx,_sy);}catch(_){}
}

function sum(arr,f){return arr.reduce((s,x)=>s+num(f(x)),0);}
function totalsOf(cont){
  const pExcl=sum(cont.purchases,x=>x.amountExcl), pVat=sum(cont.purchases,x=>x.tax), pIncl=sum(cont.purchases,x=>x.amountIncl);
  const rExcl=sum(cont.returns,x=>x.amountExcl), rVat=sum(cont.returns,x=>x.tax), rIncl=sum(cont.returns,x=>x.amountIncl);
  const sIncl=sum(cont.sales,x=>x.amountIncl), sVat=sum(cont.sales,x=>x.tax), sBefore=sum(cont.sales,x=>x.amountBefore);
  return {pExcl,pVat,pIncl,rExcl,rVat,rIncl,sIncl,sVat,salesVat:sVat,sBefore,netPurchVat:pVat-rVat};
}
function quarterTotals(q){return totalsOf(q);}
function yearTotals(y){
  const agg={purchases:[],returns:[],sales:[]};
  [1,2,3,4].forEach(n=>{const q=y.quarters[n];agg.purchases=agg.purchases.concat(q.purchases);agg.returns=agg.returns.concat(q.returns);agg.sales=agg.sales.concat(q.sales);});
  return totalsOf(agg);
}

/* ملخص قاعدة البيانات حسب مركز التكلفة */
function ccSummaryHtml(rows){
  if(!rows.length)return '';
  const map={};
  rows.forEach(r=>{const k=(r.costCenter||'').trim()||'— بدون مركز —';(map[k]=map[k]||{excl:0,vat:0,incl:0,n:0});map[k].excl+=num(r.amountExcl);map[k].vat+=num(r.tax);map[k].incl+=num(r.amountIncl);map[k].n++;});
  const keys=Object.keys(map);
  if(keys.length===1&&(keys[0]==='— بدون مركز —'))return '';
  keys.sort((a,b)=>map[b].incl-map[a].incl);
  return `<details style="margin:6px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px">
    <summary style="cursor:pointer;font-weight:800;font-size:13.5px">🏢 الإجماليات حسب مركز التكلفة (${keys.length})</summary>
    <div class="tbl-wrap" style="margin-top:10px"><table style="min-width:420px"><thead><tr><th>مركز التكلفة</th><th>عدد</th><th>قبل الضريبة</th><th>الضريبة</th><th>الإجمالي شامل</th></tr></thead><tbody>
    ${keys.map(k=>`<tr><td>${k==='— بدون مركز —'?'<span class="muted">— بدون مركز —</span>':'<span class="chip">🏢 '+esc(k)+'</span>'}</td><td class="num">${map[k].n}</td><td class="num">${fmt(map[k].excl)}</td><td class="num">${fmt(map[k].vat)}</td><td class="num">${fmt(map[k].incl)}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}

let _camDocMode=false;
async function camSaveDoc(){
  if(!_camShot){toast('مفيش صورة');return;}
  const st=document.getElementById('camStatus');if(st)st.textContent='⏳ جارٍ الحفظ...';
  try{
    const blob=await dataURLtoBlob(_camShot);
    const name='مستند_كاميرا_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.jpg';
    const q=getQuarter();const aid=uid();await putFile(aid,blob);
    q.docs.push({id:uid(),name:name,note:'',attachmentId:aid});
    saveState();closeModal();render();toast('✅ تم حفظ المستند');
  }catch(e){if(st)st.textContent='⚠️ تعذّر الحفظ: '+(e.message||'');}
}
function delDoc(id){if(!confirm('حذف المستند؟'))return;const q=getQuarter();const d=q.docs.find(x=>x.id===id);if(d&&d.attachmentId)delFile(d.attachmentId);q.docs=q.docs.filter(x=>x.id!==id);saveState();render();toast('🗑️ تم الحذف');}
async function saveDoc(){
  if(!_pendingAttach){toast('اختر ملف أولاً');return;}
  const q=getQuarter();const aid=uid();await putFile(aid,_pendingAttach.blob);
  q.docs.push({id:uid(),name:_pendingAttach.name,note:val('doc_note').trim(),attachmentId:aid});
  saveState();closeModal();render();toast('✅ تم إرفاق المستند');
}

    </div>
    <div class="result-box ${owe?'owe':'credit'}">
      ${owe?'⬆️ عليك ضريبة مستحقة للمصلحة (ضريبة المبيعات أكبر من المشتريات)':'⬇️ لك رصيد ضريبي مدوّر (ضريبة المشتريات أكبر من المبيعات)'}
      <span class="big">${fmt(Math.abs(net))}</span>
    </div>
    <div class="card" style="margin-top:18px;background:var(--card)">
      <h2 style="font-size:14px">🧮 تفاصيل المبالغ</h2>
      <div class="tbl-wrap"><table style="min-width:420px"><tbody>
        <tr><td>إجمالي المشتريات (قبل الضريبة)</td><td class="num">${fmt(t.pExcl)}</td></tr>
        <tr><td>إجمالي ضريبة المشتريات</td><td class="num">${fmt(t.pVat)}</td></tr>
        <tr><td>إجمالي مردود المشتريات (قبل الضريبة)</td><td class="num">${fmt(t.rExcl)}</td></tr>
        <tr><td>ضريبة مردود المشتريات</td><td class="num">${fmt(t.rVat)}</td></tr>
        <tr class="tfoot"><td>صافي ضريبة المشتريات</td><td class="num">${fmt(t.netPurchVat)}</td></tr>
        <tr><td>إجمالي المبيعات (قبل الضريبة)</td><td class="num">${fmt(t.sBefore)}</td></tr>
        <tr><td>إجمالي المبيعات (شامل الضريبة)</td><td class="num">${fmt(t.sIncl)}</td></tr>
        <tr><td>إجمالي ضريبة المبيعات</td><td class="num">${fmt(t.salesVat)}</td></tr>
        <tr class="tfoot" style="color:${owe?'#f87171':'#4ade80'}"><td>${owe?'صافي الضريبة المستحقة':'الرصيد المدوّر لك'}</td><td class="num">${fmt(Math.abs(net))}</td></tr>
      </tbody></table></div>
      <p class="hint">المعادلة: صافي الضريبة = ضريبة المبيعات − (ضريبة المشتريات − ضريبة مردود المشتريات).</p>

async function delRow(key,id){if(!confirm('حذف هذا السطر؟'))return;const q=getQuarter();const r=q[key].find(x=>x.id===id);const attId=r?r.attachmentId:null;const attUrl=r?r.attachmentUrl:'';if(attId)delFile(attId);q[key]=q[key].filter(x=>x.id!==id);saveState();render();toast('🗑️ تم الحذف');/* نحذف نفس الفاتورة من السحابة عشان ماترجعش عند إعادة الفتح */try{await cloudDeleteInvoice(id,attUrl);}catch(e){console.warn('cloud delete row',e);}}

function supplierRows(filter){
  const f=(filter||'').trim();

  if(!state.suppliers.length)return '<tr><td colspan="3" class="empty">لا يوجد موردون. أضف من الأعلى.</td></tr>';

}

/* كشف الفواتير المكررة */
/* مفتاح كشف تكرار المشتريات: نفس رقم الفاتورة + نفس الرقم الضريبي للمورد
   (ولو الرقم الضريبي فاضي نرجع لاسم المورد). كده الفاتورة تتعدّ مكررة حتى لو
   اسم المورد مكتوب بصيغة مختلفة طالما الرقم الضريبي ورقم الفاتورة واحد. */
function dupKeyPurchase(r){const inv=(r.invoiceNumber||'').trim();if(!inv)return null;const tax=(r.taxNumber||'').trim();const sup=(r.supplierName||'').trim();return inv+'|'+(tax||sup);}
function isDupPurchase(cont,inv,sup,excludeId,tax){inv=(inv||'').trim();if(!inv)return false;const key=inv+'|'+((tax||'').trim()||(sup||'').trim());return cont.purchases.some(r=>r.id!==excludeId&&dupKeyPurchase(r)===key);}
function isDupSale(cont,inv,excludeId){inv=(inv||'').trim();if(!inv)return false;return cont.sales.some(r=>r.id!==excludeId&&(r.invoiceNumber||'').trim()===inv);}
function dupSetPurchase(cont){const seen={},dup={};cont.purchases.forEach(r=>{const k=dupKeyPurchase(r);if(k){if(seen[k]){dup[r.id]=true;dup[seen[k]]=true;}else seen[k]=r.id;}});return dup;}
function dupSetSale(cont){const seen={},dup={};cont.sales.forEach(r=>{const k=(r.invoiceNumber||'').trim();if(k){if(seen[k])dup[r.id]=true;else seen[k]=r.id;}});return dup;}
/* ===== كشف الاشتباه (فواتير متشابهة لكن مش مطابقة تمامًا) ===== */
/* نطبّع رقم الفاتورة: تحويل الأرقام العربية + إزالة المسافات والشرطات والأصفار البادئة */
function _normInv(s){s=(s||'').toString().trim();if(!s)return '';const ar='٠١٢٣٤٥٦٧٨٩',fa='۰۱۲۳۴۵۶۷۸۹';s=s.replace(/[٠-٩]/g,d=>ar.indexOf(d)).replace(/[۰-۹]/g,d=>fa.indexOf(d));s=s.toLowerCase().replace(/[\s\-_/.\\]/g,'');s=s.replace(/^0+(?=\d)/,'');return s;}
function _amtKey(x){const n=Number(x);if(!isFinite(n)||n===0)return null;return Math.round(n*100);}
/* اشتباه مشتريات: فاتورتين مش مكررتين تمامًا لكن:
   (أ) نفس رقم الفاتورة بعد التطبيع + نفس الإجمالي، أو
   (ب) نفس الرقم الضريبي للمورد + نفس الإجمالي + نفس التاريخ */
function suspectSetPurchase(cont){const rows=cont.purchases||[];const dup=dupSetPurchase(cont);const sus={};for(let i=0;i<rows.length;i++){for(let j=i+1;j<rows.length;j++){const a=rows[i],b=rows[j];if(dup[a.id]&&dup[b.id])continue;const am=_amtKey(a.amountIncl),bm=_amtKey(b.amountIncl);if(am===null||am!==bm)continue;const ia=_normInv(a.invoiceNumber),ib=_normInv(b.invoiceNumber);const ta=(a.taxNumber||'').trim(),tbx=(b.taxNumber||'').trim();const da=(a.invoiceDate||'').trim(),db=(b.invoiceDate||'').trim();const caseA=ia&&ia===ib;const caseB=ta&&ta===tbx&&da&&da===db;if(caseA||caseB){if(!dup[a.id])sus[a.id]=true;if(!dup[b.id])sus[b.id]=true;}}}return sus;}
/* اشتباه مبيعات: نفس رقم الفاتورة بعد التطبيع + نفس الإجمالي، أو نفس الإجمالي + نفس التاريخ */
function suspectSetSale(cont){const rows=cont.sales||[];const dup=dupSetSale(cont);const sus={};for(let i=0;i<rows.length;i++){for(let j=i+1;j<rows.length;j++){const a=rows[i],b=rows[j];if(dup[a.id]&&dup[b.id])continue;const am=_amtKey(a.amountIncl),bm=_amtKey(b.amountIncl);if(am===null||am!==bm)continue;const ia=_normInv(a.invoiceNumber),ib=_normInv(b.invoiceNumber);const da=(a.date||'').trim(),db=(b.date||'').trim();const caseA=ia&&ia===ib;const caseB=da&&da===db;if(caseA||caseB){if(!dup[a.id])sus[a.id]=true;if(!dup[b.id])sus[b.id]=true;}}}return sus;}
/* تحديد ربع أي تاريخ (شهر 1-3 => 1، 4-6 => 2، 7-9 => 3، 10-12 => 4) */
function quarterOfDate(dstr){
  if(!dstr)return null;
  let s=String(dstr).trim();
  let m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  let mo=null;
  if(m){mo=parseInt(m[2],10);}
  else{m=s.match(/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);if(m)mo=parseInt(m[2],10);}
  if(!mo||mo<1||mo>12)return null;
  return Math.floor((mo-1)/3)+1;
}
/* فحص توافق التاريخ مع الربع المفتوح. يرجع null لو متوافق أو الرئيسي مبيّن */
function checkQuarterMatch(dateStr){
  const q=quarterOfDate(dateStr);
  if(!q)return null;
  if(q===sel.quarter)return null;
  const c=getCompany(),y=getYear();
  const exists=!!(y&&y.quarters&&y.quarters[q]);
  return {q:q,exists:exists,months:QUARTERS.find(x=>x.n===q).months};
}
/* نقل صف من ربع لربع آخر */
function moveRowToQuarter(key,rowObj,fromQ,toQ){
  const y=getYear();if(!y||!y.quarters[toQ])return false;
  y.quarters[fromQ][key]=y.quarters[fromQ][key].filter(x=>x.id!==rowObj.id);
  y.quarters[toQ][key].push(rowObj);
  return true;
}

function enhanceCanvas(c){
  try{

    const img=ctx.getImageData(0,0,c.width,c.height);const d=img.data;

      d[i+1]=Math.max(0,Math.min(255,(d[i+1]-128)*contrast+128+bright));
      d[i+2]=Math.max(0,Math.min(255,(d[i+2]-128)*contrast+128+bright));
    }

  }catch(e){}

function compressForAI(file,maxDim,quality){return new Promise((resolve)=>{try{if(!(file.type||'').startsWith('image/')){const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.readAsDataURL(file);return;}const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const scale=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{resolve(c.toDataURL('image/jpeg',quality));}catch(e){const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.readAsDataURL(file);}};img.onerror=()=>{URL.revokeObjectURL(url);const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.readAsDataURL(file);};img.src=url;}catch(e){const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.readAsDataURL(file);}});}

function loadPdfLib(){

    s.onload=()=>{try{if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(window.pdfjsLib);}else reject(new Error('pdf.js لم يُحمّل'));}catch(e){reject(e);}};

// يحوّل أول صفحة من ملف PDF لصورة JPEG (data URL) عشان الذكاء الاصطناعي يقراها
async function renderPdfToImage(file,maxDim,quality){
  const lib=await loadPdfLib();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const base=page.getViewport({scale:1});
  const scale=Math.min(4,Math.max(1,maxDim/Math.max(base.width,base.height)));
  const viewport=page.getViewport({scale:scale});
  const c=document.createElement('canvas');c.width=Math.round(viewport.width);c.height=Math.round(viewport.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:viewport}).promise;
  return c.toDataURL('image/jpeg',quality);
}

  runAI(type);}
async function runAI(type){
  const st=document.getElementById('aiStatus');

  if(!keys.length){st.innerHTML='<span style="color:#f87171">⚠️ اضبط مفتاح الذكاء الاصطناعي أولاً من زر (إعداد الذكاء) أعلى.</span>';return;}
  st.textContent='⏳ جارٍ قراءة الفاتورة...';
  const prompt='أنت خبير محاسبة ضريبية متخصص في قراءة الفواتير العربية (السعودية/المصرية) والإنجليزية ودول الخليج. مهمتك استخراج بيانات الفاتورة من الصورة بدقة تامة.\n\nقواعد القراءة المهمة:\n1) اقرأ كل النص الظاهر بتمعّن، بما في ذلك النص بجانب الأرقام والرموز والعملات، وتجاهل الترويسات والشعارات والعناوين غير المرتبطة بالفاتورة.\n2) ابحث عن المصطلحات المطابقة هذه: «اسم المورد/البائع/المؤسسة/الشركة» = البائع، و«المشتري/العميل» ليس المورد.\n3) الرقم الضريبي: رقم مكوّن عادة من 15 خانة (السعودية) أو 9 خانات (مصر)؛ قد يُكتب باسم «الرقم الضريبي» أو «VAT No» أو «Tax Number» أو «الرقم الموحد». خُذ رقم البائع لا رقم المشتري.\n4) التاريخ: حوّله إلى صيغة YYYY-MM-DD. انتبه للتواريخ الميلادية (2024/2025) لا الهجرية.\n5) المبالغ: «المبلغ قبل الضريبة» = الأساس/Subtotal/الخاضع للضريبة/Net Amount. «الضريبة» = VAT/ض.ق.م/الضريبة المضافة. «الإجمالي» = Grand Total/المبلغ شامل الضريبة. تأكد أن الأساس + الضريبة = الإجمالي، ولو مش متساوي راجع قراءتك.\n6) لا تخلط بين الأرقام العربية الغربية (0123) والأرقام العربية المشرقية (٠١٢٣٤٥٦٧٨٩) — حوّل المشرقية إلى قيمتها الرقمية.\n7) احذف الفواصل الآلاف والرموز (مثل 1,250.00 => 1250.00) وأرجع الأرقام كأرقام عشرية فقط بدون عملة.\n8) لا تحتسب الضريبة بنفسك إذا كانت ظاهرة؛ استخدم القيم المكتوبة. ولو غير ظاهرة اكتب 0.\n9) نسبة الضريبة الموحّدة في النظام 15%؛ فلو الأساس موجود والضريبة ناقصة فاحسبها 15%.\n10) لا تعتمد على التخمين: أي حقل غير موجود اتركه نص فارغ أو 0.\n\nأرجع JSON فقط بهذا الشكل بدون أي شرح أو علامات Markdown:\n{"supplier":"اسم المورد/البائع","taxNumber":"الرقم الضريبي","date":"YYYY-MM-DD","invoiceNumber":"رقم الفاتورة","amountExcl":رقم المبلغ قبل الضريبة,"tax":رقم قيمة الضريبة,"amountIncl":رقم المبلغ شامل الضريبة}';
  const fast=flashOn();
  let model=state.aiCfg.model;const ep=(state.aiCfg.endpoint||'');if(fast&&ep.includes('generativelanguage.googleapis.com'))model='gemini-flash-lite-latest';
  const maxTok=fast?700:900;
  let lastErr='';
  for(let i=0;i<keys.length;i++){
    const key=keys[i];
    if(keys.length>1)st.textContent='⏳ جارٍ القراءة... (مفتاح '+(i+1)+' من '+keys.length+')';
    try{
      const ctrl=new AbortController();const tmo=setTimeout(()=>ctrl.abort(),30000);
      let resp;try{resp=await fetch(state.aiCfg.endpoint,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:model,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:_aiImgData}}]}],max_tokens:maxTok,temperature:0})});}finally{clearTimeout(tmo);}
      if(!resp.ok){const tx=await resp.text();const er=new Error('HTTP '+resp.status+' '+tx.slice(0,160));er.status=resp.status;throw er;}
      const data=await resp.json();
      let txt=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
      const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('لم يتم التعرف على بيانات');
      let d=JSON.parse(m[0]);
      // فحص ذاتي: لو (قبل + ضريبة) لا يساوي الإجمالي، جرّب تصحيح ثانٍ
      if(!fast){
        const e0=num(d.amountExcl),t0=num(d.tax),i0=num(d.amountIncl);
        const bad=(i0>0&&e0>0&&Math.abs((e0+t0)-i0)>1)||(e0>0&&t0===0)||(!e0&&!t0&&i0>0);
        if(bad){
          st.textContent='🔍 جارٍ مراجعة الأرقام للتأكد...';
          const fixPrompt='راجع الفاتورة المرفقة مراجعة دقيقة جداً. المشكلة: القيم المستخرجة سابقاً كانت: '+JSON.stringify(d)+'\nوهي غير متسقة (المبلغ قبل الضريبة + الضريبة يجب أن يساوي الإجمالي، ونسبة الضريبة ' + VAT_RATE + '%).\nاقرأ الفاتورة مرة أخرى بعناية شديدة وأرجع JSON مصحّح فقط بنفس المفاتيح:{ "supplier","taxNumber","date","invoiceNumber","amountExcl","tax","amountIncl" }. لا تكتب أي شرح.';
          try{
            const ctrl2=new AbortController();const tmo2=setTimeout(()=>ctrl2.abort(),30000);
            let r2;try{r2=await fetch(state.aiCfg.endpoint,{method:'POST',signal:ctrl2.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:model,messages:[{role:'user',content:[{type:'text',text:fixPrompt},{type:'image_url',image_url:{url:_aiImgData}}]}],max_tokens:900,temperature:0})});}finally{clearTimeout(tmo2);}
            if(r2.ok){const d2=await r2.json();const t2=(d2.choices&&d2.choices[0]&&d2.choices[0].message&&d2.choices[0].message.content)||'';const m2=t2.match(/\{[\s\S]*\}/);if(m2){const dd=JSON.parse(m2[0]);Object.keys(d).forEach(k=>{if(dd[k]!==undefined&&dd[k]!==''&&dd[k]!==null)d[k]=dd[k];});}}
          }catch(e2){}
        }
      }
      fillFromAI(type,d);
      st.innerHTML='<span style="color:#4ade80">✅ تمت قراءة الفاتورة وتعبئة الخانات'+(keys.length>1?(' (بالمفتاح '+(i+1)+')'):'')+'. راجعها قبل الحفظ.</span>';
      return;
    }catch(e){
      lastErr=e.message;
      if(e.name==='AbortError')lastErr='انتهت المهلة (الاتصال بطيء)';
      if(/404|no longer available|not found|is not supported|unsupported/i.test(e.message)){st.innerHTML='<span style="color:#f87171">⚠️ تعذرت القراءة: '+esc(e.message)+'<br>💡 الموديل اللي مكتوب في الإعدادات اتوقف من الخدمة. افتح (إعداد الذكاء) واختر Google Gemini تاني (هيتحط gemini-flash-latest) ثم احفظ وجرّب.</span>';return;}
      const retryable=(e.name==='AbortError'||e.status===401||e.status===403||e.status===429||e.status>=500||/quota|rate|exceed|limit|invalid|expired|permission|unauthorized|resource/i.test(e.message));
      if(!retryable||i===keys.length-1)break;
    }
  }
  st.innerHTML='<span style="color:#f87171">⚠️ تعذرت القراءة'+(keys.length>1?(' بكل المفاتيح ('+keys.length+')'):'')+'. آخر خطأ: '+esc(lastErr)+'</span>';
}
function fillFromAI(type,d){
  if(type==='p'){
    if(d.supplier)setVal('f_sup',d.supplier);
    if(d.taxNumber)setVal('f_tax',d.taxNumber);
    if(d.date)setVal('f_date',normDate(d.date));
    if(d.invoiceNumber)setVal('f_inv',d.invoiceNumber);
    setVal('f_rate',VAT_RATE);
    const e0=num(d.amountExcl),t0=num(d.tax),i0=num(d.amountIncl);
    if(e0){setVal('f_excl',e0);const tv=(t0>0?t0:+(e0*VAT_RATE/100).toFixed(2));setVal('f_vat',tv);setVal('f_incl',+(e0+tv).toFixed(2));}
    else if(i0){setVal('f_incl',i0);const ee=+(i0/(1+VAT_RATE/100)).toFixed(2);setVal('f_excl',ee);setVal('f_vat',+(i0-ee).toFixed(2));}
    rememberSupplier(val('f_sup').trim(),val('f_tax').trim());
  }else{
    if(d.date)setVal('s_date',normDate(d.date));
    if(d.invoiceNumber)setVal('s_inv',d.invoiceNumber);
    setVal('s_rate',VAT_RATE);
    if(d.amountIncl)setVal('s_incl',d.amountIncl);
    else if(num(d.amountExcl))setVal('s_incl',(num(d.amountExcl)*(1+VAT_RATE/100)).toFixed(2));
    sCalc();
  }
}
function normDate(s){s=String(s).trim();let m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=s.match(/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}

/* ============ نسخة احتياطية / استرجاع ============ */
function blobToDataURL(b){return new Promise((r,rej)=>{/* دعم الصور القديمة المخزنة كـ {name,dataURL} بدل Blob */if(b&&!(b instanceof Blob)&&b.dataURL){return r(b.dataURL);}const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=rej;try{rd.readAsDataURL(b);}catch(e){rej(e);}});}
async function dataURLtoBlob(u){const res=await fetch(u);return await res.blob();}
function collectAttIds(){const ids=[];state.companies.forEach(c=>c.years.forEach(y=>{[1,2,3,4].forEach(n=>{const q=y.quarters[n];['purchases','returns','sales','docs'].forEach(k=>(q[k]||[]).forEach(r=>{if(r.attachmentId)ids.push(r.attachmentId);}));});}));return ids;}
async function buildBackupPkg(){
  const ids=collectAttIds();const atts={};
  for(const id of ids){try{const b=await getFile(id);if(b)atts[id]=await blobToDataURL(b);}catch(e){}}
  return {_type:'vat_backup',version:1,exportedAt:new Date().toISOString(),state:{companies:state.companies,suppliers:state.suppliers,vatRate:state.vatRate,aiCfg:{endpoint:state.aiCfg.endpoint,model:state.aiCfg.model,key:'',keys:[]}},attachments:atts};
}

function importAll(inp){const f=inp.files&&inp.files[0];if(!f)return;

  rd.onload=async()=>{
    /* نقرأ النسخة الأساسية (بدون المرفقات) عشان نعرض البيانات فورًا بسرعة */

async function saveDirHandle(h){const db=await openDB();return new Promise((res)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(h,'__backupDir');t.oncomplete=()=>res();});}
async function getDirHandle(){try{return await getFile('__backupDir');}catch(e){return null;}}
function supportsFS(){return typeof window.showDirectoryPicker==='function';}
async function chooseBackupFolder(){
  if(!supportsFS()){toast('⚠️ المتصفح لا يدعم هذه الميزة (افتح البرنامج على Chrome أو Edge على الكمبيوتر)، أو نزّل نسخة يدوية.',8000);return;}
  /* الميزة ممنوعة داخل iframe (شائع في المعاينات/الـ embeds — وهو سبب «تم الإلغاء» بعد الرفع) */
  let inIframe=false; try{inIframe=(window.self!==window.top);}catch(e){inIframe=true;}

    return;
  }
  try{
    /* v4: استدعاء بسيط بدون أي خيارات (أكثر توافقاً) — بعض نسخ كروم بترمي AbortError
       لو مرّرنا mode:'readwrite' أو startIn لمجلد محمي. نطلب صلاحية الكتابة بعد الاختيار. */
    const h=await window.showDirectoryPicker();
    try{await h.requestPermission({mode:'readwrite'});}catch(_){}
    await saveDirHandle(h);
    state.backupMode='folder';saveState();
    toast('✅ تم ربط المجلد. ستُؤخذ نسخة تلقائية يومياً.');
    await runDailyBackup(true);
    openBackupSettings();
  }catch(e){
    console.warn('chooseBackupFolder error:',e);
    const nm=(e&&e.name)||'Error';
    const msg=(e&&e.message)||'(بدون رسالة)';
    let inFrm='غير معروف'; try{inFrm=(window.self!==window.top)?'نعم':'لا';}catch(_){inFrm='نعم';}
    let act='غير معروف'; try{if(navigator.userActivation&&typeof navigator.userActivation.isActive!=='undefined')act=navigator.userActivation.isActive?'نعم':'لا';}catch(_){}
    const ctx='— تشخيص السبب —'
      +'\n• الخطأ: '+nm
      +'\n• الرسالة: '+msg
      +'\n• اتصال آمن (https): '+(window.isSecureContext?'نعم':'لا ⚠️')
      +'\n• داخل إطار (iframe): '+inFrm
      +'\n• تفاعل مستخدم نشط: '+act
      +'\n• العنوان: '+location.origin;
    if(nm==='AbortError'){
      alert('↩️ اتقفلت نافذة اختيار المجلد (AbortError).\nلو ما قفلتهاش بنفسك، ابعتلي صورة من التشخيص ده:\n\n'+ctx);
    }else{
      alert('⚠️ تعذّر فتح نافذة اختيار المجلد. ابعتلي صورة من التشخيص ده:\n\n'+ctx);
    }
    openBackupSettings();
  }
}
async function ensurePerm(h){if(!h)return false;const opt={mode:'readwrite'};if((await h.queryPermission(opt))==='granted')return true;if((await h.requestPermission(opt))==='granted')return true;return false;}
async function runDailyBackup(force){
  const h=await getDirHandle();if(!h)return false;
  if(!(await ensurePerm(h))){return false;}
  try{
    const pkg=await buildBackupPkg();
    const fh=await h.getFileHandle(BACKUP_FILENAME,{create:true});
    const w=await fh.createWritable();await w.write(JSON.stringify(pkg));await w.close();
    state.lastBackup=new Date().toISOString().slice(0,10);saveState();
    if(force)toast('✅ تم حفظ النسخة التلقائية');
    return true;
  }catch(e){if(force)toast('⚠️ تعذر الحفظ: '+e.message);return false;}
}

async function runDailyBackupDownload(force){

async function checkDailyBackup(){

}

/* تنظيف لمرة واحدة: إزالة الفواتير السحابية التي وُضِعت بالخطأ في الشركة المفتوحة بسبب الباگ القديم؛ ستُعاد من السحابة بالتوجيه الصحيح لكل شركة عند أول مزامنة */
function cleanupMisplacedRemote(){
  if(state._remoteRouteFix)return;
  let removed=0;
  (state.companies||[]).forEach(c=>(c.years||[]).forEach(y=>{[1,2,3,4].forEach(n=>{const q=y.quarters&&y.quarters[n];if(!q)return;['purchases','returns','sales'].forEach(k=>{const arr=q[k]||[];const before=arr.length;q[k]=arr.filter(r=>r&&r.remote!==true);removed+=before-q[k].length;});});}));
  state._remoteRouteFix=true;
  idbSaveStateDebounced();
  try{console.log('cleanupMisplacedRemote removed',removed);}catch(e){}
}

/* ===== تذكّرني: حفظ/استرجاع بيانات الدخول (اختياري) ===== */
const REMEMBER_KEY='vat_laptop_remember_v1';
function loadRemember(){try{const s=localStorage.getItem(REMEMBER_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function saveRemember(u,p){try{localStorage.setItem(REMEMBER_KEY,JSON.stringify({u:u||'',p:p||'',t:Date.now()}));}catch(e){}}
function clearRemember(){try{localStorage.removeItem(REMEMBER_KEY);}catch(e){}}
function applyRememberUI(){try{const r=loadRemember();const cb=document.getElementById('lg_remember'),u=document.getElementById('lg_user'),p=document.getElementById('lg_pass');
  if(r&&r.u){if(u&&!u.value)u.value=r.u;if(cb){cb.checked=true;if(p&&!p.value&&r.p)p.value=r.p;}}
  else if(cb){cb.checked=false;}
}catch(e){}}
function hideLoginScreen(){const a=document.getElementById('authRoot');if(a){a.style.display='none';a.classList.remove('login-wrap');a.innerHTML='';}const ly=document.querySelector('.layout');if(ly)ly.style.display='';}
function setLoginErr(m){const e=document.getElementById('lg_err');if(e)e.textContent=m||'';}

async function doLogin(){
  const uEl=document.getElementById('lg_user'),pEl=document.getElementById('lg_pass');
  /* تنسيق اسم المستخدم: شيل المسافات الزايدة — وعشان الإيميلات ما تفرقش بين حروف كبيرة وصغيرة */
  let u=(uEl&&uEl.value||'').trim();
  const p=(pEl&&pEl.value||'');
  if(!u||!p){setLoginErr('اكتب اسم المستخدم وكلمة السر');return;}
  const btn=document.getElementById('lg_btn');if(btn){btn.disabled=true;btn.textContent='جاري التحقق…';}
  await ensureSb();
  if(!sb){if(btn){btn.disabled=false;btn.textContent='دخول';}setLoginErr('الاتصال السحابي غير جاهز — تأكد من إعداد Supabase');return;}
  const _tryLogin=(uname)=>sb.rpc('app_login',{p_username:uname,p_password:p});
  try{
    let {data,error}=await _tryLogin(u);
    /* لو فشل والاسم فيه @ (إيميل) أو حروف كبيرة، جرّب بصيغة صغيرة — قاعدة البيانات بتعتبر الحروف حالة */
    const looksEmpty=(d)=>{const r0=(Array.isArray(d)?d[0]:d);return !r0||!r0.ok||!r0.username;};
    if(!error&&looksEmpty(data)){
      const lc=u.toLowerCase();
      if(lc!==u){const t2=await _tryLogin(lc);if(!t2.error&&!looksEmpty(t2.data)){data=t2.data;error=t2.error;u=lc;}}
    }
    if(btn){btn.disabled=false;btn.textContent='دخول';}
    if(error){
      const em=(error.message||'')+(error.details||'');
      if(/function .*app_login.* does not exist|app_login/i.test(em)&&/does not exist|could not find/i.test(em)){
        setLoginErr('دالة تسجيل الدخول (app_login) غير موجودة في قاعدة البيانات — راجع إعداد Supabase.');
      }else if(/permission denied|row-level security|policy/i.test(em)){
        setLoginErr('صلاحيات القاعدة رافضة تسجيل الدخول — راجع سياسات Supabase.');
      }else{
        setLoginErr('خطأ اتصال: '+(error.message||''));
      }
      return;
    }
    const row=(Array.isArray(data)?data[0]:data);
    if(!row||!row.ok||!row.username){
      /* وضّح السبب الحقيقي اللي راجع من الدالة بدل الرسالة المضلّلة العامة */
      const msg=(row&&(row.message||row.error||row.reason))||'';
      if(msg){setLoginErr(msg);}
      else if(row&&row.active===false){setLoginErr('الحساب موقوف — كلّم المدير يفعّله.');}
      else{setLoginErr('اسم المستخدم أو كلمة السر غير صحيحة — راجع إنك بتكتبهم بالظبط زي ما اتسجّلوا (حروف كبيرة/صغيرة والمسافات).');}
      return;
    }
    session={username:row.username,name:row.name,role:row.role,companyId:row.company_id,companyName:row.company_name,costCenter:row.cost_center};
    /* تذكّرني: نحفظ بيانات الدخول لو المربع متعلّم، ومسحناه لو مش متعلّم */
    try{const cb=document.getElementById('lg_remember');if(cb&&cb.checked){saveRemember(u,p);}else{clearRemember();}}catch(e){}
    saveSession();hideLoginScreen();
    if(isReviewer())sel.view='pending';
    applyRolePerms();render();
    if(!cloud.enabled){try{cloudAutoStart();}catch(e){}}
    if(isReviewer()){try{await loadReviewerCompanies();}catch(e){}}
    loadPending();
  }catch(e){if(btn){btn.disabled=false;btn.textContent='دخول';}setLoginErr('خطأ: '+(e&&e.message||''));}
}

function _removeFromQuarters(row){
  if(!row)return;const c=state.companies.find(x=>x.id===row.company_id);if(!c)return;
  const y=c.years.find(x=>x.year===row.year);if(!y)return;const qk=String(row.quarter);if(!y.quarters[qk])return;
  ['purchases','returns','sales'].forEach(b=>{y.quarters[qk][b]=(y.quarters[qk][b]||[]).filter(x=>x.id!==row.id);});
}

/* فلترة الفواتير المعلّقة — عرض/إخفاء الصفوف حسب الفلاتر بدون إعادة بناء */
function applyPendFilters(){
  const raw=val('pendSearch')||'';
  const q=raw.trim().toLowerCase();
  const comp=val('pendFltComp')||'',kind=val('pendFltKind')||'',st=val('pendFltStatus')||'';
  _pendFlt={q:raw,comp:comp,kind:kind,st:st};
  const tb=document.querySelector('#tbl_pending tbody');if(!tb)return;
  let shown=0;
  Array.from(tb.querySelectorAll('tr[data-id]')).forEach(tr=>{
    let ok=true;
    if(comp&&tr.getAttribute('data-comp')!==comp)ok=false;
    if(ok&&kind&&tr.getAttribute('data-kind')!==kind)ok=false;
    if(ok&&st&&tr.getAttribute('data-status')!==st)ok=false;
    if(ok&&q&&!(tr.textContent||'').toLowerCase().includes(q))ok=false;
    tr.style.display=ok?'':'none';if(ok)shown++;
  });
  const nm=document.getElementById('pendNoMatch');if(nm)nm.style.display=shown?'none':'';
}
function resetPendFilters(){const s=document.getElementById('pendSearch');if(s)s.value='';['pendFltComp','pendFltKind','pendFltStatus'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});applyPendFilters();}
/* يرجّع قيم الفلاتر بعد إعادة بناء الواجهة (زي التحديث) ثم يعيد تطبيقها */
function restorePendFilters(){const s=document.getElementById('pendSearch');if(!s)return;s.value=_pendFlt.q||'';const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v||'';};set('pendFltComp',_pendFlt.comp);set('pendFltKind',_pendFlt.kind);set('pendFltStatus',_pendFlt.st);applyPendFilters();}
/* ===== اعتماد/رفض جماعي ===== */
async function bulkApprove(){
  const ids=Array.from(_pendSel);if(!ids.length){toast('حدّد فاتورة واحدة على الأقل');return;}
  if(!confirm('اعتماد '+ids.length+' فاتورة مرة واحدة؟'))return;
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  showCloudLoad('⏫ جاري اعتماد '+ids.length+' فاتورة…');
  let ok=0,fail=0;
  for(let i=0;i<ids.length;i++){
    const id=ids[i];
    try{
      const {data,error}=await sb.rpc('review_invoice',{p_id:id,p_action:'approve',p_reviewer:session.username,p_reviewer_name:session.name,p_note:null});
      if(error||!data||!data.ok){fail++;auditAdd('approve',id,null,false,((data&&data.error)||(error&&error.message)||''));continue;}
      const row=pendingRows[id];const attUrl=(row&&row.attachment_url)||'';if(row){delete pendingRows[id];row.status='approved';row.approved_by=(session&&session.name)||(session&&session.username)||'';setApprover(id,row.approved_by);const k=row.kind==='sale'?'sale':(row.kind==='return'?'return':'purchase');setFromRow(k,row,row.year,row.quarter);const localRow=findLocalInvoiceById(id);const localOk=await pullApprovedAttachment(localRow,attUrl);if(localRow&&localOk)localRow.localOnly=true;await cloudSetApprover(id,row.approved_by);if(localOk&&isOwner()){try{await cloudDeleteInvoice(id,attUrl);}catch(e){console.warn('purge after bulk approve',e);}}auditAdd('approve',id,row,true,'');}
      ok++;
    }catch(e){fail++;auditAdd('approve',id,null,false,(e&&e.message||''));}
    showCloudLoad('⏫ جاري اعتماد '+(i+1)+' / '+ids.length+'…');
    await new Promise(r=>setTimeout(r,60));
  }
  _pendSel=new Set();saveState();updatePendingBadge();render();hideCloudLoad();
  toast('✅ تم اعتماد '+ok+' فاتورة'+(fail?(' • فشل '+fail):''));
}
async function bulkReject(){
  const ids=Array.from(_pendSel);if(!ids.length){toast('حدّد فاتورة واحدة على الأقل');return;}
  let note=prompt('سبب الرفض (هيوصل للمستخدم) — ممكن تختار من: '+REJECT_PRESETS.join(' / '),'');
  if(note===null)return;note=(note||'').trim();if(!note){toast('لازم تكتب سبب الرفض');return;}
  if(!confirm('رفض '+ids.length+' فاتورة بنفس السبب؟'))return;
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  showCloudLoad('⏫ جاري رفض '+ids.length+' فاتورة…');
  let ok=0,fail=0;
  for(let i=0;i<ids.length;i++){
    const id=ids[i];
    try{
      const {data,error}=await sb.rpc('review_invoice',{p_id:id,p_action:'reject',p_reviewer:session.username,p_reviewer_name:session.name,p_note:note});
      if(error||!data||!data.ok){fail++;auditAdd('reject',id,null,false,((data&&data.error)||(error&&error.message)||''));continue;}

/* يدور على فاتورة محلية بالـ id في أي ربع/شركة */
function findLocalInvoiceById(id){
  if(!id)return null;
  for(const c of state.companies)for(const y of (c.years||[]))for(const qk in (y.quarters||{})){const q=y.quarters[qk];for(const b of ['purchases','returns','sales']){const r=(q[b]||[]).find(x=>x&&x.id===id);if(r)return r;}}
  return null;
}
/* ☁️→💾 ينزّل صورة الفاتورة المعتمدة جوّه الجهاز (IndexedDB) ويتأكد إنها اتخزنت.
   يرجّع true لو الصورة بقت محفوظة محليًا (أو مفيش صورة أصلًا) — وساعتها بس نقدر نمسح من السحابة بأمان. */
async function pullApprovedAttachment(localRow,attUrl){
  if(!localRow)return false;
  if(localRow.attachmentId){try{const f=await getFile(localRow.attachmentId);if(f){localRow.attachmentUrl='';return true;}}catch(e){}}
  if(!attUrl)return true;/* مفيش صورة أصلًا — مفيش حاجة نخاف عليها */
  try{
    const resp=await fetch(attUrl);
    if(!resp||!resp.ok)return false;
    const blob=await resp.blob();
    if(!blob||!blob.size)return false;
    const aid=uid();
    await putFile(aid,blob);
    const chk=await getFile(aid);/* تحقق إن الصورة فعلًا اتكتبت */
    if(!chk||!chk.size)return false;
    localRow.attachmentId=aid;
    localRow.attachmentUrl='';/* نعتمد على النسخة المحلية مش رابط السحابة */
    return true;
  }catch(e){console.warn('pullApprovedAttachment',e);return false;}
}
async function approveInvoice(id){
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  try{
    const {data,error}=await sb.rpc('review_invoice',{p_id:id,p_action:'approve',p_reviewer:session.username,p_reviewer_name:session.name,p_note:null});
    if(error||!data||!data.ok){auditAdd('approve',id,null,false,((data&&data.error)||(error&&error.message)||''));toast('⚠️ تعذر الاعتماد: '+((data&&data.error)||(error&&error.message)||''));return;}
    const row=pendingRows[id];const attUrl=(row&&row.attachment_url)||'';
    let purged=false,localOk=true;
    if(row){
      delete pendingRows[id];row.status='approved';row.approved_by=(session&&session.name)||(session&&session.username)||'';setApprover(id,row.approved_by);
      const k=row.kind==='sale'?'sale':(row.kind==='return'?'return':'purchase');
      setFromRow(k,row,row.year,row.quarter);
      /* ☁️→💾 ننزّل الصورة محليًا ونتأكد، وبعدها بس نمسح من السحابة (التخزين محلي + السحابة وصلة عبور) */
      const localRow=findLocalInvoiceById(id);
      localOk=await pullApprovedAttachment(localRow,attUrl);
      if(localRow&&localOk)localRow.localOnly=true;
      saveState();
      await cloudSetApprover(id,row.approved_by);
      if(localOk&&isOwner()){try{await cloudDeleteInvoice(id,attUrl);purged=true;}catch(e){console.warn('purge after approve',e);}}
    }
    auditAdd('approve',id,row,true,'');
    updatePendingBadge();render();
    if(!localOk)toast('⚠️ اتعمدت الفاتورة بس تعذّر تنزيل صورتها محليًا — سابناها في السحابة مؤقتًا لحد ما تتأكد الصورة',8000);
    else toast('✅ تم الاعتماد ودخلت الربع'+(attUrl?' — الصورة اتخزنت على الجهاز'+(purged?' واتشالت من السحابة':''):''));
  }catch(e){auditAdd('approve',id,null,false,(e&&e.message||''));toast('⚠️ خطأ: '+(e&&e.message||''));}
}
async function rejectInvoice(id){
  const note=prompt('سبب الرفض (هيوصل للمستخدم اللي قرأ الفاتورة):\nمقترحات: '+REJECT_PRESETS.join(' / '));
  if(note===null)return;if(!note.trim()){toast('لازم تكتب سبب الرفض');return;}
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  try{
    const {data,error}=await sb.rpc('review_invoice',{p_id:id,p_action:'reject',p_reviewer:session.username,p_reviewer_name:session.name,p_note:note.trim()});
    if(error||!data||!data.ok){auditAdd('reject',id,null,false,((data&&data.error)||(error&&error.message)||''));toast('⚠️ تعذر الرفض: '+((data&&data.error)||(error&&error.message)||''));return;}
    if(pendingRows[id]){pendingRows[id].status='rejected';pendingRows[id].review_note=note.trim();}
    auditAdd('reject',id,pendingRows[id]||null,true,note.trim());
    updatePendingBadge();render();toast('↩️ تم رفض الفاتورة وإرجاعها للمستخدم');
  }catch(e){auditAdd('reject',id,null,false,(e&&e.message||''));toast('⚠️ خطأ: '+(e&&e.message||''));}
}
/* 🗑️ حذف الفاتورة من المراجع: ما بنمسحش السطر من السحابة — بنحوّل حالته لـ deleted
   عشان تفضل تبان عند القارئ بحالة «محذوف» ومايقدرش يعدلها. */
async function deleteInvoiceByReviewer(id){
  const row=pendingRows[id]||null;
  if(!confirm('حذف الفاتورة دي؟\nهتختفي من المعلّقة، وهتظهر عند القارئ بحالة «محذوف» ومش هيقدر يعدلها.'))return;
  await ensureSb();if(!sb){toast('⚠️ الاتصال غير جاهز');return;}
  try{
    const up=await sb.from('invoices').update({status:'deleted',review_note:'اتحذفت بمعرفة المراجع '+((session&&session.name)||(session&&session.username)||'')}).eq('id',id);
    if(up.error){auditAdd('delete',id,row,false,up.error.message||'');toast('⚠️ تعذر الحذف: '+(up.error.message||''));return;}
    if(pendingRows[id])delete pendingRows[id];
    try{_removeFromQuarters(row);}catch(e){}
    try{if(_pendSel&&_pendSel.has(id))_pendSel.delete(id);}catch(e){}
    saveState();
    auditAdd('delete',id,row,true,'حذف من المراجع');
    updatePendingBadge();render();
    toast('🗑️ تم حذف الفاتورة — هتظهر عند القارئ بحالة «محذوف»');
  }catch(e){auditAdd('delete',id,row,false,(e&&e.message||''));toast('⚠️ خطأ: '+(e&&e.message||''));}
}
/* ===== سجل المراجعة (Audit Log) ===== */
const AUDIT_KEY='vat_audit_log_v1';
let _audit=null;
function auditLoad(){if(_audit)return _audit;try{_audit=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]')||[];}catch(e){_audit=[];}return _audit;}
function auditSave(){try{localStorage.setItem(AUDIT_KEY,JSON.stringify(_audit.slice(0,2000)));}catch(e){}}
/* اسم المراجع يتسجّل دايمًا: من الجلسة، وإلا من قائمة المستخدمين (الاسم الظاهر)، وإلا اسم اليوزر */
function _auditReviewerName(){
  if(session&&session.name)return session.name;
  try{const u=(_usersCache||[]).find(x=>x&&x.username===(session&&session.username));if(u&&(u.display_name||u.name))return u.display_name||u.name;}catch(e){}
  return (session&&session.username)||'';
}
function auditAdd(action,id,row,ok,note){

async function pullAuditFromCloud(){
  try{await ensureSb();if(!sb||!cloud.enabled)return;
    const arr=[];
    /* المصدر الأساسي: جدول audit_log الدائم على السيرفر */
    try{const r1=await sb.from('audit_log').select('*').order('ts',{ascending:false}).limit(2000);
      if(r1&&r1.data){r1.data.forEach(r=>{arr.push({eid:r.eid||uid(),ts:num(r.ts)||(r.created_at?Date.parse(r.created_at):0),action:r.action,ok:r.ok!==false,id:r.invoice_id||'',user:r.reviewer_user||'',name:r.reviewer_name||'',role:r.reviewer_role||'',supplier:r.supplier||'',company:r.company||'',company_id:r.company_id||'',amount:(r.amount==null?null:num(r.amount)),date:r.invoice_date||'',note:r.note||''});});}
    }catch(_){}
    /* توافق خلفي: السجلات القديمة المخزّنة في app_settings */
    try{const res=await sb.from('app_settings').select('key,value').like('key','audit::%');
      if(res&&res.data){res.data.forEach(r=>{try{const v=JSON.parse(r.value||'null');if(Array.isArray(v)){v.forEach(function(e){if(e&&e.action){if(!e.eid)e.eid=uid();arr.push(e);}});}else if(v&&v.action){if(!v.eid)v.eid=String(r.key).slice(7);arr.push(v);}}catch(_){}});}
    }catch(_){}

  }catch(e){console.warn('pullAudit',e);}
}
